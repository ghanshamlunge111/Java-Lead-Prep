      title: "Reverse a string (multiple ways)",
      tag: "must",
      type: "program",
      answer: `The simplest way is \`new StringBuilder(s).reverse()\`. To show the logic, I'd use a two-pointer swap on a char array, which is O(n) time and O(n) extra space for the array, since Strings are immutable. A stream version is possible but less efficient, so I'd mention it only to show familiarity.`,
      code: `import java.util.stream.*;

public class ReverseString {
    public static void main(String[] args) {
        String s = "PAYMENT";

        // 1. StringBuilder
        System.out.println("StringBuilder : " + new StringBuilder(s).reverse());

        // 2. Two pointers on char array
        char[] chars = s.toCharArray();
        for (int i = 0, j = chars.length - 1; i < j; i++, j--) {
            char tmp = chars[i]; chars[i] = chars[j]; chars[j] = tmp;
        }
        System.out.println("Two pointers  : " + new String(chars));

        // 3. Stream
        String streamed = IntStream.range(0, s.length())
                .mapToObj(i -> String.valueOf(s.charAt(s.length() - 1 - i)))
                .collect(Collectors.joining());
        System.out.println("Stream        : " + streamed);

        // 4. Recursion
        System.out.println("Recursion     : " + reverse(s));
    }

    static String reverse(String s) {
        return s.isEmpty() ? s : reverse(s.substring(1)) + s.charAt(0);
    }
}`,
      run: "java8",
      output: `StringBuilder : TNEMYAP

      id: "prg-palindrome",
      title: "Palindrome check",
      tag: "must",
      type: "program",
      answer: `Use two pointers from both ends moving towards the centre, returning false on the first mismatch. That's O(n) time and O(1) extra space. For phrases, I skip non-alphanumeric characters and compare case-insensitively.`,
      code: `public class PalindromeCheck {
    static boolean isPalindrome(String s) {
        int i = 0, j = s.length() - 1;
        while (i < j) {
            while (i < j && !Character.isLetterOrDigit(s.charAt(i))) i++;
            while (i < j && !Character.isLetterOrDigit(s.charAt(j))) j--;
            if (Character.toLowerCase(s.charAt(i)) != Character.toLowerCase(s.charAt(j))) return false;
            i++; j--;
        }
        return true;
    }

    static boolean isPalindrome(int n) {
        if (n < 0) return false;
        int original = n, reversed = 0;
        while (n > 0) { reversed = reversed * 10 + n % 10; n /= 10; }
        return original == reversed;
    }

    public static void main(String[] args) {
        System.out.println("madam                          : " + isPalindrome("madam"));
        System.out.println("A man, a plan, a canal: Panama : " + isPalindrome("A man, a plan, a canal: Panama"));
        System.out.println("banking                        : " + isPalindrome("banking"));
        System.out.println("12321                          : " + isPalindrome(12321));
    }
}`,
      run: "java8",
      output: `madam                          : true
A man, a plan, a canal: Panama : true
banking                        : false
12321                          : true`,

        { q: "Can you do it with StringBuilder.reverse()?", a: "Yes, s.equals(new StringBuilder(s).reverse().toString()), but it uses O(n) extra space and doesn't short-circuit on the first mismatch." },
        { q: "How do you check a number without converting to String?", a: "Reverse the digits with % 10 and / 10 and compare with the original, as shown." }
      ]
    },
    {

      title: "Character frequency",
      tag: "must",
      type: "program",

            sb.append(a).append(i < n - 1 ? " " : "");
            long next = a + b;
            a = b;
            b = next;
        }
        System.out.println("Iterative : " + sb);

        if (n < 2) return n;
        if (memo.containsKey(n)) return memo.get(n);

        memo.put(n, value);
        return value;
    }
}`,

public class BalancedBrackets {
    static boolean isBalanced(String s) {
        Deque<Character> stack = new ArrayDeque<>();

            } else if (c == ')' || c == ']' || c == '}') {

                char open = stack.pop();

public class BinarySearch {

      followups: [
        { q: "What happens to a key with a TTL after you SET it again without EX?", a: "A plain SET removes the existing TTL, so the key becomes persistent. Use `SET ... KEEPTTL` or pass `EX` again." },
        { q: "How do you pick a TTL?", a: "From how stale the business can tolerate the data being, e.g. minutes for FX display rates, hours for reference data, and shorter TTLs for anything users act on." }
      ]
    },
    {
      id: "rds-spring-cache",
      title: "Spring Boot Redis cache with RedisCacheManager",
      tag: "must",
      type: "concept",
      answer: `With \`spring-boot-starter-data-redis\` and \`@EnableCaching\`, I configure a \`RedisCacheManager\` so Spring's cache annotations are backed by Redis. I set a default TTL, per-cache TTLs, and a JSON serializer so cached values are readable and not tied to Java serialization. Then \`@Cacheable\` reads through the cache, \`@CachePut\` always runs the method and refreshes the entry, and \`@CacheEvict\` removes it on updates or deletes.`,
      code: `@Configuration
@EnableCaching
public class CacheConfig {
    @Bean
    public RedisCacheManager cacheManager(RedisConnectionFactory cf) {
        RedisCacheConfiguration base = RedisCacheConfiguration.defaultCacheConfig()
            .entryTtl(Duration.ofMinutes(10))
            .disableCachingNullValues()
            .serializeValuesWith(RedisSerializationContext.SerializationPair
                .fromSerializer(new GenericJackson2JsonRedisSerializer()));
        return RedisCacheManager.builder(cf)
            .cacheDefaults(base)
            .withCacheConfiguration("fxRates", base.entryTtl(Duration.ofMinutes(1)))
            .build();
    }
}

@Service
public class CustomerService {
    @Cacheable(value = "customers", key = "#id")
    public CustomerDto get(String id) { return repo.findDtoById(id); }

    @CachePut(value = "customers", key = "#dto.id")
    public CustomerDto update(CustomerDto dto) { return repo.saveDto(dto); }

    @CacheEvict(value = "customers", key = "#id")
    public void delete(String id) { repo.deleteById(id); }
}`,
      points: [
        "Cache annotations work through proxies: self-invocation and private methods bypass them.",
        "Cache DTOs, not JPA entities with lazy associations.",
        "`unless = \"#result == null\"` or `disableCachingNullValues()` controls null caching."

      followups: [
        { q: "@CachePut vs @CacheEvict on update?", a: "@CachePut always executes the method and writes the result into the cache; @CacheEvict just removes the entry. Evict is safer under concurrent writes because the next read loads fresh data." },

      type: "comparison",
      answer: `\`RedisTemplate<K,V>\` is the general-purpose API, and by default it uses JDK serialization, which writes unreadable binary, ties data to Java class versions and is a security risk on deserialization. \`StringRedisTemplate\` uses String serializers for keys and values, so data is human-readable and interoperable with other languages. In practice I configure \`RedisTemplate<String, Object>\` with a \`StringRedisSerializer\` for keys and a Jackson JSON serializer for values.`,
      code: `@Bean
public RedisTemplate<String, Object> redisTemplate(RedisConnectionFactory cf) {
    RedisTemplate<String, Object> t = new RedisTemplate<>();
    t.setConnectionFactory(cf);
    t.setKeySerializer(new StringRedisSerializer());
    t.setHashKeySerializer(new StringRedisSerializer());
    t.setValueSerializer(new GenericJackson2JsonRedisSerializer());
    t.setHashValueSerializer(new GenericJackson2JsonRedisSerializer());
    return t;

// usage
redisTemplate.opsForValue().set("fx:USD:INR", rate, Duration.ofMinutes(5));
stringRedisTemplate.opsForValue().increment("login:fail:" + userId);`,

    },
    {
      id: "rds-cache-consistency",
      title: "Keeping the cache consistent with the database",
      tag: "must",
      type: "scenario",
      answer: `The standard approach is: update the database first, then delete the cache key, and let the next read repopulate it. Updating the cache instead, or deleting before the DB write, opens race windows where a concurrent reader puts stale data back. A remaining small race can be handled with a delayed double delete, deleting again a few hundred milliseconds later, and every entry has a TTL as a safety net. For stronger guarantees across services, I'd drive invalidation from the database change stream with CDC, for example Debezium publishing to Kafka, so the cache is invalidated even if the app crashes after committing.`,
      points: [
        "Order: commit DB, then evict cache (after commit, e.g. `@TransactionalEventListener(phase = AFTER_COMMIT)`).",
        "TTL bounds the worst-case staleness.",
        "CDC/outbox-based invalidation survives app crashes between DB commit and cache delete.",
        "Accept that a cache is eventually consistent; don't cache what can't tolerate that."

      followups: [
        { q: "Why not evict inside the transaction before commit?", a: "A concurrent read could miss the cache, read the old committed row and put it back before your commit, so the cache stays stale until TTL." },
        { q: "What if the cache delete fails?", a: "Retry it asynchronously (e.g. via a message), and rely on TTL as the backstop. That's why TTLs are mandatory." }
      ]
    },
    {
      id: "rds-penetration-stampede-avalanche",
      title: "Cache penetration, breakdown (stampede) and avalanche",
      tag: "must",
      type: "scenario",
      answer: `These are the three classic cache failure modes. **Penetration** is repeated requests for keys that don't exist anywhere, so every request hits the DB; fix it by caching a short-lived null marker or using a Bloom filter, plus input validation. **Breakdown**, or stampede, is when one hot key expires and thousands of requests hit the DB at once; fix it with a mutex so only one request reloads, or refresh hot keys before expiry. **Avalanche** is when many keys expire at the same time or Redis goes down; fix it with random TTL jitter, high availability, and circuit breakers or rate limits in front of the DB.`,
      code: `// Stampede protection with a short Redis lock
public FxRate getRate(String pair) {
    FxRate r = cache.get(pair);
    if (r != null) return r;
    String lockKey = "lock:fx:" + pair;
    Boolean locked = redis.opsForValue().setIfAbsent(lockKey, "1", Duration.ofSeconds(5));
    if (Boolean.TRUE.equals(locked)) {
        try {
            r = rateRepo.load(pair);
            long ttl = 300 + ThreadLocalRandom.current().nextInt(60); // jitter
            cache.put(pair, r, Duration.ofSeconds(ttl));
            return r;
        } finally { redis.delete(lockKey); }
    }
    sleepBriefly();               // others wait and retry the cache
    return getRate(pair);
}`,
      points: [
        "Penetration: cache nulls briefly, Bloom filter, validate IDs.",
        "Breakdown: mutex/single-flight reload, logical expiry, pre-warm hot keys.",
        "Avalanche: TTL jitter, Redis HA (Sentinel/Cluster), DB protection with circuit breaker."
      ],
      followups: [
        { q: "What's 'logical expiry'?", a: "Store the expiry time inside the value and never let the key physically expire. A reader that sees it's logically expired returns the stale value and triggers one async refresh." },
        { q: "Does Spring Cache help with stampede?", a: "`@Cacheable(sync = true)` synchronises loading within one JVM, which helps, but across many instances you still need a distributed approach." }
      ]
    },
    {
      id: "rds-distributed-lock",
      title: "Distributed lock with Redis (SET NX PX, Redisson, Redlock)",
      tag: "must",
      type: "concept",
      answer: `A basic Redis lock is \`SET lock:key <uniqueToken> NX PX 30000\`: NX ensures only one client gets it, and PX gives it an expiry so a crashed holder doesn't block forever. Release must be atomic and check ownership, so I use a Lua script that deletes the key only if the value matches my token; otherwise I might delete someone else's lock after mine expired. In Spring apps I usually use Redisson, which handles this plus a watchdog that extends the lease while the holder is alive. Redlock across multiple masters exists, but it's debated because of clock and GC-pause issues, so for correctness-critical work I add fencing tokens or rely on DB constraints.`,
      code: `String token = UUID.randomUUID().toString();
Boolean ok = redis.opsForValue()
    .setIfAbsent("lock:eod-batch", token, Duration.ofSeconds(30));
if (Boolean.TRUE.equals(ok)) {
    try {
        runEndOfDayBatch();
    } finally {
        String lua = "if redis.call('get', KEYS[1]) == ARGV[1] then "
                   + "return redis.call('del', KEYS[1]) else return 0 end";
        redis.execute(new DefaultRedisScript<>(lua, Long.class),
                      List.of("lock:eod-batch"), token);
    }
}

// Redisson
RLock lock = redisson.getLock("lock:account:" + accountId);
if (lock.tryLock(2, TimeUnit.SECONDS)) {      // watchdog renews lease
    try { process(); } finally { lock.unlock(); }
}`,
      points: [
        "Unique token per holder + Lua compare-and-delete for safe release.",
        "Lease expiry is a trade-off: too short and work outlives the lock; too long and recovery is slow.",
        "Fencing token: a monotonically increasing number checked by the resource, rejecting stale holders.",
        "For money movement, the DB (optimistic locking, unique constraints) remains the real guard."
      ],
      followups: [
        { q: "Why can't you just DEL the key to unlock?", a: "If your work took longer than the lease, the lock expired and another client acquired it. A plain DEL would remove their lock. Checking the token prevents that." },
        { q: "What's the problem with Redlock?", a: "It assumes bounded clock drift and process pauses. A long GC pause can make a client believe it still holds an expired lock. Fencing tokens are needed for strict safety." }
      ]
    },
    {
      id: "rds-rate-limiting",
      title: "Rate limiting with Redis",
      tag: "must",
      type: "design",
      answer: `Because all app instances share Redis, it's a natural place for API rate limits. A **fixed window** uses \`INCR\` on a key per user per minute plus \`EXPIRE\`; it's simple but allows bursts at window edges. A **sliding window log** stores request timestamps in a Sorted Set, removes old ones with \`ZREMRANGEBYSCORE\` and counts the rest, which is accurate but uses more memory. A **token bucket** refills tokens at a fixed rate and allows controlled bursts; it's best done in a Lua script so the check and update are atomic. Spring Cloud Gateway's Redis rate limiter is a token bucket.`,
      code: `// Fixed window: max 100 requests per user per minute
public boolean allow(String userId) {
    String key = "rl:" + userId + ":" + (System.currentTimeMillis() / 60000);
    Long count = redis.opsForValue().increment(key);
    if (count != null && count == 1) {
        redis.expire(key, Duration.ofSeconds(60));
    }
    return count != null && count <= 100;
}

# Sliding window (as one Lua script / MULTI):
ZREMRANGEBYSCORE rl:user42 0 (now-60000)
ZADD rl:user42 now reqId
ZCARD rl:user42          -> reject if > limit
PEXPIRE rl:user42 60000`,

        "Fixed window: cheapest, edge bursts up to 2x the limit.",
        "Sliding window: accurate, memory grows with request rate.",
        "Token bucket: smooth rate with bounded bursts; needs Lua for atomicity.",
        "Return HTTP 429 with a `Retry-After` header."
      ],
      followups: [
        { q: "Why is INCR then EXPIRE slightly risky?", a: "If the app dies between the two calls, the key never expires. Use a Lua script or `SET key 0 EX 60 NX` followed by INCR to make it safe." },
        { q: "Where should rate limiting live?", a: "Ideally at the API gateway for coarse limits, with finer business limits (e.g. OTP attempts) in the service." }
      ]
    },
    {
      id: "rds-spring-session",
      title: "Distributed session store with Spring Session",
      tag: "good",
      type: "concept",
      answer: `When a stateful web app runs on several instances, the HTTP session must be shared or users get logged out when the load balancer switches instance. Spring Session replaces the container's HttpSession with one stored in Redis, transparently, by adding \`spring-session-data-redis\`. That removes the need for sticky sessions and survives instance restarts. For pure REST APIs we usually go stateless with JWT instead, but internet-banking portals with server-side sessions commonly use this.`,

@Configuration
@EnableRedisHttpSession(maxInactiveIntervalInSeconds = 900) // 15-min idle timeout
public class SessionConfig { }

// application.yml (alternative to the annotation)
// spring.session.timeout: 15m`,

        "No sticky sessions needed; any instance can serve any request.",

    {
      id: "rds-persistence",
      title: "Redis persistence: RDB vs AOF",
      tag: "good",
      type: "comparison",
      answer: `Redis offers two persistence options. **RDB** takes point-in-time snapshots at intervals using a forked child process, which gives compact files and fast restarts, but you can lose the writes since the last snapshot. **AOF**, the append-only file, logs every write command and can fsync every second, so you lose at most about a second of data, at the cost of larger files and periodic rewrites. Many setups enable both. For a pure cache, persistence can even be disabled, because the DB can rebuild it.`,
      points: [
        "RDB: compact, fast recovery, data loss window = snapshot interval.",
        "AOF `appendfsync everysec`: about 1 second of potential loss; `always` is safest but slow.",
        "Fork for snapshots can cause latency spikes on large datasets."
      ],
      followups: [
        { q: "Would you use Redis as the primary store for transactions?", a: "No. Even with AOF it isn't a replacement for a relational DB with ACID transactions for a ledger. It's a cache or supporting store." }
      ]
    },
    {
      id: "rds-ha-cluster",
      title: "Replication, Sentinel and Redis Cluster",
      tag: "must",
      type: "concept",
      answer: `Replication copies a master's data to replicas asynchronously, which gives read scaling and a hot standby. **Sentinel** monitors the master and automatically promotes a replica on failure, telling clients the new master address; it's high availability for a single data set. **Redis Cluster** shards data across multiple masters using 16,384 hash slots, with each master owning a slot range and having its own replicas, which gives both horizontal scaling and failover. Multi-key operations in Cluster only work when keys share a slot, which you force with hash tags like \`{acc123}:balance\`.`,
      points: [
        "Replication is async: a failover can lose the last few writes.",
        "Sentinel = HA for one dataset; Cluster = sharding + HA.",
        "Slot = CRC16(key) mod 16384; hash tags `{...}` keep related keys together.",
        "Managed options: AWS ElastiCache, Azure Cache for Redis."
      ],
      followups: [
        { q: "Why does a MGET across keys fail in Cluster?", a: "The keys hash to different slots on different nodes (CROSSSLOT error). Use hash tags so they land in the same slot, or fetch them separately." },
        { q: "Can a lock be lost on failover?", a: "Yes. The lock written to the master may not have replicated before failover, so another client can acquire it on the new master. That's one reason fencing tokens matter." }
      ]
    },
    {
      id: "rds-pubsub-streams-kafka",
      title: "Redis Pub/Sub vs Redis Streams vs Kafka",
      tag: "good",
      type: "comparison",
      answer: `Redis **Pub/Sub** is fire-and-forget: messages go to currently connected subscribers and are lost if nobody is listening, so it suits notifications like cache-invalidation broadcasts. Redis **Streams** are a persistent append-only log with consumer groups, acknowledgements and pending lists, good for lightweight queues within Redis's memory limits. **Kafka** is a distributed, disk-based log built for high-throughput, durable, replayable event streaming with long retention. For core business events like payment status changes I'd use Kafka; for in-cluster signals Pub/Sub or Streams are fine.`,
      points: [
        "Pub/Sub: no persistence, no replay, at-most-once.",
        "Streams: persistence, consumer groups, `XACK`, bounded by RAM.",
        "Kafka: partitions, replication, days of retention, replay from any offset."
      ],
      followups: [
        { q: "How would you invalidate local caches across 10 instances?", a: "Publish an invalidation message on a Redis Pub/Sub channel; every instance subscribes and evicts the key from its local cache. TTL covers missed messages." }
      ]
    },
    {
      id: "rds-hot-big-keys",
      title: "Hot keys and big keys",
      tag: "good",
      type: "scenario",
      answer: `A **hot key** gets a huge share of traffic, like a global config key or a popular FX rate, and overloads the single node or slot owning it. Fixes include a local in-process cache in front of Redis, replicating the key under several suffixes and reading randomly, or reading from replicas. A **big key** is a value or collection that's too large, like a list with millions of entries; it slows commands, blocks the event loop on delete and causes uneven memory in Cluster. Fix it by splitting into smaller keys, paging with \`HSCAN\`/\`SSCAN\`, and deleting with \`UNLINK\`, which frees memory in the background.`,
      code: `redis-cli --hotkeys      # requires an LFU eviction policy
redis-cli --bigkeys      # samples the keyspace for large keys
MEMORY USAGE customer:1001
UNLINK big:list:key      # non-blocking delete`,
      points: [
        "Hot key: local cache, key replication, read replicas.",
        "Big key: split, paginate, `UNLINK` instead of `DEL`.",
        "Monitor with `SLOWLOG GET` for slow commands."
      ],
      followups: [
        { q: "Why is deleting a big key dangerous?", a: "DEL frees memory synchronously on the main thread, which can block Redis for seconds. UNLINK does it in a background thread." }
      ]
    },
    {
      id: "rds-local-vs-distributed",
      title: "Local cache (Caffeine) vs Redis and two-level caching",
      tag: "must",
      type: "comparison",
      answer: `A local cache like Caffeine lives inside the JVM heap, so reads are nanoseconds with no network hop, but each instance has its own copy, which can diverge, and it consumes heap. Redis is shared across all instances, so data is consistent and survives app restarts, but every read is a network call. For very hot, rarely changing data I use two levels: Caffeine with a short TTL as L1 and Redis as L2, with Pub/Sub invalidation to clear L1 on all instances when data changes.`,
      code: `@Bean
public CacheManager localCacheManager() {
    CaffeineCacheManager m = new CaffeineCacheManager("branches", "products");
    m.setCaffeine(Caffeine.newBuilder()
        .maximumSize(10_000)
        .expireAfterWrite(Duration.ofMinutes(2))
        .recordStats());
    return m;
}`,
      points: [
        "Caffeine: fastest, per-instance, heap cost, uses W-TinyLFU eviction.",
        "Redis: shared, consistent across instances, network latency.",
        "Two-level: L1 short TTL + L2 Redis + invalidation broadcast."
      ],
      followups: [
        { q: "When is a local cache enough?", a: "Small reference data that changes rarely, like branch codes or currency lists, where a few minutes of staleness per instance is acceptable." }
      ]
    },
    {
      id: "rds-what-not-to-cache",
      title: "What not to cache in banking",
      tag: "must",
      type: "scenario",
      answer: `I don't serve anything from cache that drives a money decision and needs strong consistency, like the available balance used to authorise a debit, transaction limits being consumed, or the ledger. Those reads must go to the source of truth inside the transaction, with locking. A cached balance can be shown on a dashboard with an "as of" time, but the debit path always checks the database. I also avoid caching sensitive data like full card numbers or tokens unless encrypted and short-lived, because Redis is a shared, often less-protected store.`,
      points: [
        "Cache: reference data, profiles, FX display rates, product configs, read-only statements.",
        "Never as authority: balances for authorisation, limit consumption, ledger entries.",
        "Sensitive data: avoid, or encrypt with short TTL; enable Redis AUTH/ACL and TLS."
      ],
      followups: [
        { q: "The business wants faster balance enquiry. What do you do?", a: "Cache the display balance with a short TTL and event-driven invalidation on every posting, clearly separate from the authorisation path, which still reads and locks the DB row." }
      ]
    }
  ]
});

  id: "devops",

  title: "Docker, Kubernetes & CI/CD",
  blurb: "How a Spring Boot service is packaged, deployed, scaled, observed and released. Lead-level interviews expect you to own the path from commit to production.",
  topics: [
    {
      id: "ops-container-vs-vm",
      title: "Container vs virtual machine",
      tag: "must",
      type: "comparison",
      answer: `A virtual machine virtualises the hardware, so each VM runs its own full guest OS on a hypervisor. That makes it heavy: gigabytes in size and minutes to boot. A container virtualises at the OS level. It shares the host kernel and isolates processes using Linux **namespaces** for isolation and **cgroups** for resource limits. So a container is megabytes in size and starts in seconds. For microservices we use containers because we get the same image from laptop to production, fast scaling, and much higher density per server.`,
      points: [
        "VM: strong isolation, own kernel, heavier; container: lighter, shared kernel, weaker isolation.",
        "Containers solve \"works on my machine\": the image carries the JRE, the app and its config defaults.",
        "In practice they combine: Kubernetes nodes are usually VMs running many containers.",
        "Because the kernel is shared, a Linux container can't run directly on a Windows kernel without a VM layer (Docker Desktop uses one)."
      ],
      followups: [
        { q: "What are namespaces and cgroups?", a: "Namespaces give a process its own view of PIDs, network, mounts and hostname, which is the isolation. Cgroups limit and account for CPU, memory and I/O, which is how `--memory` and Kubernetes limits are enforced." },
        { q: "Is a container secure enough for banking workloads?", a: "Yes, with hardening: minimal base images, non-root users, read-only filesystems, image scanning, network policies, and secrets from a vault. Where stronger isolation is mandated, sandboxed runtimes or dedicated nodes are used." }
      ]
    },
    {
      id: "ops-image-layers",
      title: "Docker image, container, layers & build cache",
      tag: "must",
      type: "concept",
      answer: `An **image** is a read-only template built from a Dockerfile. A **container** is a running instance of an image with a thin writable layer on top. Each Dockerfile instruction like \`RUN\`, \`COPY\` or \`ADD\` creates a layer, and layers are cached and shared between images. Docker reuses a cached layer until something in that step or an earlier one changes. So I order the Dockerfile from least to most frequently changing: base image, then dependencies, then application code. That way a code change rebuilds only the last thin layer, not the 200 MB of dependencies.`,
      code: `# Bad: any code change invalidates the dependency download
COPY . .
RUN mvn package

# Good: dependencies cached until pom.xml changes
COPY pom.xml .
RUN mvn -B dependency:go-offline
COPY src ./src
RUN mvn -B package -DskipTests`,
      points: [
        "Image = layers + metadata; container = image + writable layer + runtime state.",
        "Layers are content-addressed (SHA256), so identical layers are stored and pulled only once.",
        "Data written inside a container is lost when it's removed, so use volumes for anything persistent.",
        "Tag images with an immutable version or git SHA, not just `latest`."
      ],
      followups: [
        { q: "Why is using the `latest` tag in production a problem?", a: "It's mutable, so two nodes can pull different images and you can't tell exactly what is running or roll back reliably. Use a version or commit SHA tag, ideally pinned by digest." },
        { q: "How do you reduce image size?", a: "Multi-stage builds so Maven and the JDK stay out of the final image, a slim JRE or distroless base, a `.dockerignore`, and combining `RUN` steps that clean up after themselves." }
      ]
    },
    {
      id: "ops-dockerfile-boot",
      title: "Dockerfile for a Spring Boot app",
      tag: "must",
      type: "design",
      answer: `I use a **multi-stage build**. The first stage uses a JDK and Maven to build the jar, and the final stage contains only a slim JRE and the application. I also use Spring Boot's **layered jar** (\`-Djarmode=layertools\`, or \`tools\` in Boot 3.3+), which splits dependencies, the Spring Boot loader, snapshot dependencies and application classes into separate Docker layers, so a code change only re-pushes a few kilobytes. The container runs as a **non-root user**, has JVM memory settings that respect container limits, and exposes a health check.`,
      code: `# ---- build stage ----
FROM eclipse-temurin:17-jdk AS build
WORKDIR /app
COPY .mvn .mvn
COPY mvnw pom.xml ./
RUN ./mvnw -B dependency:go-offline
COPY src ./src
RUN ./mvnw -B package -DskipTests
RUN java -Djarmode=layertools -jar target/*.jar extract --destination extracted

# ---- runtime stage ----
FROM eclipse-temurin:17-jre
RUN groupadd -r app && useradd -r -g app app
WORKDIR /app
COPY --from=build /app/extracted/dependencies/ ./
COPY --from=build /app/extracted/spring-boot-loader/ ./
COPY --from=build /app/extracted/snapshot-dependencies/ ./
COPY --from=build /app/extracted/application/ ./
USER app
EXPOSE 8080
ENV JAVA_TOOL_OPTIONS="-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
HEALTHCHECK --interval=30s --timeout=3s \\
  CMD curl -fs http://localhost:8080/actuator/health/liveness || exit 1
ENTRYPOINT ["java", "org.springframework.boot.loader.launch.JarLauncher"]`,
      points: [
        "Boot 3.2+ launcher class is `org.springframework.boot.loader.launch.JarLauncher`; Boot 2.x used `org.springframework.boot.loader.JarLauncher`.",
        "Alternative: `mvn spring-boot:build-image` builds an OCI image with Cloud Native Buildpacks, with no Dockerfile.",
        "Use exec-form `ENTRYPOINT [..]` so Java is PID 1 and receives SIGTERM for graceful shutdown.",
        "`HEALTHCHECK` is used by Docker/Compose; Kubernetes ignores it and uses probes instead.",
        "The `curl` health check needs curl in the image; slim or distroless images may not have it."
      ],
      followups: [
        { q: "Why run as a non-root user?", a: "If the app is compromised, the attacker doesn't get root inside the container, which limits damage and container escape risk. Many Kubernetes clusters enforce `runAsNonRoot` through pod security standards." },
        { q: "Why does the exec form of ENTRYPOINT matter?", a: "The shell form wraps Java in `/bin/sh -c`, so the shell is PID 1 and may not forward SIGTERM. Then the JVM is killed abruptly instead of shutting down gracefully." },
        { q: "What goes in `.dockerignore`?", a: "`target/`, `.git`, IDE folders, local env files and secrets. That keeps the build context small, speeds up builds, and avoids leaking files into the image." }
      ]
    },
    {
      id: "ops-docker-commands",
      title: "Docker commands for troubleshooting",
      tag: "good",
      type: "concept",
      answer: `When a container misbehaves, I start with \`docker ps -a\` to see whether it's running or exited and its exit code, then \`docker logs -f\` for the application logs. \`docker inspect\` shows the real config: environment variables, mounts, network, restart count and the OOMKilled flag. \`docker exec -it <container> sh\` lets me get inside and check files, DNS or connectivity, and \`docker stats\` shows live CPU and memory against the limit. Exit code **137** means the container was killed by SIGKILL, very often because it ran out of memory, and **143** means it stopped normally on SIGTERM.`,
      code: `docker ps -a                                  # status + exit code
docker logs --tail 200 -f payment-svc         # app logs
docker inspect payment-svc | grep -i oom      # "OOMKilled": true ?
docker exec -it payment-svc sh                # get a shell inside
docker stats payment-svc                      # live CPU / memory vs limit
docker exec payment-svc jcmd 1 Thread.print   # thread dump of the JVM (PID 1)
docker cp payment-svc:/tmp/heap.hprof .       # copy a heap dump out`,
      points: [
        "Exit 137 = SIGKILL (often OOM), 143 = SIGTERM, 1 = application error at startup.",
        "`docker system df` and `docker system prune` for disk space problems.",
        "`docker network inspect` to debug service-to-service name resolution in Compose."
      ],
      followups: [
        { q: "How do you take a heap dump from a JVM in a container?", a: "Use `docker exec <c> jcmd 1 GC.heap_dump /tmp/heap.hprof` (needs a JDK or jcmd in the image), then `docker cp` it out. Better still, set `-XX:+HeapDumpOnOutOfMemoryError` with a path on a mounted volume." },
        { q: "The container keeps restarting immediately. What do you check?", a: "`docker logs` of the last run and the exit code. Usually it's a missing env var or config, the database isn't reachable at startup, a port conflict, or the wrong entrypoint." }
      ]
    },
    {
      id: "ops-compose",
      title: "docker-compose for local development",
      tag: "good",
      type: "design",
      answer: `Docker Compose defines a multi-container environment in one YAML file, so any developer can run the service with its real dependencies using a single \`docker compose up\`. For a payment service I'd include the app, PostgreSQL, Kafka and Redis on one network, where services reach each other by service name. I use \`depends_on\` with health checks so the app starts only after the database is ready. As a lead, this standardises onboarding and removes "it works with my local Postgres" problems. Spring Boot 3.1+ can even start the compose file automatically with \`spring-boot-docker-compose\`.`,
      code: `services:
  payment-svc:
    build: .
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
    depends_on:

  kafka:

    ports: ["9092:9092"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:`,
      points: [
        "Inside the Compose network use service names (`postgres`), not `localhost`.",
        "Compose is for local/dev and CI; production orchestration is Kubernetes.",
        "Environment variables override `application.yml` via Spring relaxed binding (`SPRING_DATASOURCE_URL`).",
        "A real Kafka setup needs advertised-listener config for clients outside the network; trimmed here."
      ],
      followups: [
        { q: "Why didn't `depends_on` alone stop my app failing on DB connection?", a: "Plain `depends_on` only waits for the container to start, not for Postgres to accept connections. Use `condition: service_healthy` with a healthcheck, and keep connection retry in the app as well." },
        { q: "Compose vs Testcontainers?", a: "Compose is for running the whole stack locally. Testcontainers starts throwaway containers from inside automated tests, so each test run is isolated and reproducible in CI." }

    },
    {
      id: "ops-jvm-containers",
      title: "JVM in containers: memory limits and OOMKilled",
      tag: "must",
      type: "concept",
      answer: `Since Java 10, and backported to 8u191, the JVM is **container-aware**. It reads the cgroup memory and CPU limits instead of the host's. By default, though, max heap is only 25% of the container memory, so I set \`-XX:MaxRAMPercentage=70-75\` rather than a hard \`-Xmx\`. The key point is that the JVM uses more than the heap: metaspace, thread stacks, the code cache, direct buffers used by Netty and Kafka, and GC structures. If the heap is set close to the limit, total memory crosses it and the kernel kills the container with **OOMKilled**, exit code 137. You won't see a Java \`OutOfMemoryError\` in the logs in that case.`,
      code: `# Container limit 1Gi -> heap ~750MB, leaves ~250MB for non-heap
JAVA_TOOL_OPTIONS="-XX:MaxRAMPercentage=75 \\
  -XX:+ExitOnOutOfMemoryError \\
  -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps"

# Check what the JVM actually sees inside the container
java -XX:+PrintFlagsFinal -version | grep -E "MaxHeapSize|ActiveProcessorCount"`,
      points: [
        "Java `OutOfMemoryError` = heap/metaspace exhausted inside the JVM; OOMKilled = the whole process exceeded the container limit.",
        "Old Java 8 builds (before 8u191) ignore cgroups and size the heap from host RAM, which is a classic OOMKilled cause.",
        "CPU limits affect `availableProcessors()`, which sizes GC threads and the common ForkJoinPool.",
        "Native Memory Tracking (`-XX:NativeMemoryTracking=summary` + `jcmd 1 VM.native_memory`) shows non-heap usage."
      ],
      followups: [
        { q: "A pod is OOMKilled but heap usage in Grafana looks fine. Why?", a: "Non-heap memory is the culprit: too many threads, direct/off-heap buffers, metaspace growth or a native leak. Use Native Memory Tracking to find it, and lower `MaxRAMPercentage` or raise the limit." },
        { q: "Why prefer MaxRAMPercentage over -Xmx?", a: "It scales automatically when the container limit changes per environment, so you don't have to keep `-Xmx` in sync with each Kubernetes limit." }
      ]
    },
    {
      id: "ops-k8s-architecture",
      title: "Kubernetes architecture",
      tag: "must",
      type: "concept",
      answer: `Kubernetes is a container orchestrator that keeps the cluster in a **desired state** that I declare in YAML. The **control plane** has the **API server**, the front door that everything talks to, including \`kubectl\`. **etcd** is the key-value store holding all cluster state. The **scheduler** decides which node a new pod runs on, based on resources and constraints. The **controller manager** runs reconciliation loops, for example keeping three replicas alive. Each **worker node** runs the **kubelet**, which starts pods and reports their health, **kube-proxy**, which programs networking for Services, and a **container runtime** like containerd.`,
      points: [
        "Everything is declarative: controllers continuously reconcile actual state toward desired state.",
        "Only the API server talks to etcd; etcd backups are critical for cluster recovery.",
        "Managed clusters (EKS, AKS, GKE, OpenShift) run the control plane for you.",
        "Docker images still run fine: Kubernetes uses containerd/CRI-O directly since dockershim was removed (1.24)."
      ],
      followups: [
        { q: "What happens when you run `kubectl apply -f deployment.yaml`?", a: "The API server validates the request and stores it in etcd. The Deployment controller creates a ReplicaSet, which creates Pods. The scheduler assigns each Pod to a node, and that node's kubelet pulls the image and starts the containers." },
        { q: "What happens if a node dies?", a: "The node controller marks it NotReady. After a timeout its pods are evicted, and the ReplicaSet controller creates replacements, which the scheduler places on healthy nodes." }
      ]
    },
    {
      id: "ops-pod-deployment",
      title: "Pod, ReplicaSet and Deployment",
      tag: "must",
      type: "concept",
      answer: `A **Pod** is the smallest deployable unit: one or more containers that share a network IP and volumes, usually one app container plus optional sidecars. Pods are ephemeral and are never managed directly. A **ReplicaSet** ensures that a given number of identical pods are running. A **Deployment** manages ReplicaSets and adds rolling updates and rollback, so for a stateless Spring Boot service I always define a Deployment. When I change the image, the Deployment creates a new ReplicaSet and gradually shifts pods to it.`,
      points: [
        "Pods get a new IP when recreated, so clients use a Service, never pod IPs.",
        "Sidecar examples: log shipper, service-mesh proxy (Envoy/Istio).",
        "Init containers run to completion before the app starts (e.g. DB migration check, waiting for a dependency).",
        "`kubectl rollout history` shows ReplicaSet revisions used for rollback."
      ],
      followups: [
        { q: "When would you put two containers in one pod?", a: "Only when they're tightly coupled and must share the network or a volume, like an app and its log-forwarding or proxy sidecar. Independent services go in separate pods so they can scale separately." },
        { q: "Why not create pods directly?", a: "A bare pod isn't recreated if it dies or its node fails. A Deployment gives self-healing, scaling and controlled rollouts." }
      ]
    },
    {
      id: "ops-service-ingress",
      title: "Service types and Ingress",
      tag: "must",
      type: "comparison",
      answer: `A **Service** gives a stable virtual IP and DNS name in front of a changing set of pods, selected by labels, and load-balances across them. **ClusterIP** is the default and is reachable only inside the cluster, which is right for service-to-service calls. **NodePort** opens a port on every node, which is mostly for testing. **LoadBalancer** provisions a cloud load balancer with an external IP. For HTTP traffic, I use an **Ingress** with an ingress controller like NGINX. It routes many hostnames and paths to different ClusterIP services through one entry point, and handles TLS termination.`,
      code: `# account-svc calls payment-svc by DNS name:
#   http://payment-svc.payments.svc.cluster.local:8080
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-api
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.mybank.com]
      secretName: api-tls
  rules:
    - host: api.mybank.com
      http:
        paths:
          - path: /payments
            pathType: Prefix
            backend: { service: { name: payment-svc, port: { number: 8080 } } }
          - path: /accounts
            pathType: Prefix
            backend: { service: { name: account-svc, port: { number: 8080 } } }`,
      points: [
        "Service discovery is built in via cluster DNS, so Eureka is often unnecessary on Kubernetes.",
        "Only Ready pods receive traffic, which ties Services to readiness probes.",
        "Gateway API is the newer, more expressive successor to Ingress.",
        "An API gateway (auth, rate limiting) can sit behind or replace a plain Ingress."
      ],
      followups: [
        { q: "Ingress vs LoadBalancer Service?", a: "A LoadBalancer Service gives one external IP per service, which is costly and works at layer 4. Ingress gives a single layer-7 entry point with host and path routing and TLS for many services." },
        { q: "Do you still need Eureka on Kubernetes?", a: "Usually not. Kubernetes Services and DNS give discovery and load balancing. Eureka is mostly kept for consistency during migrations or in hybrid environments." }
      ]
    },
    {
      id: "ops-deployment-yaml",
      title: "Deployment and Service YAML for a Spring Boot service",
      tag: "must",
      type: "design",
      answer: `This is a production-style manifest for a payment service. It runs three replicas for availability with a rolling-update strategy that keeps full capacity during a release. Resource requests and limits are set, configuration comes from a ConfigMap and a Secret, and probes point at Actuator's liveness and readiness groups. A ClusterIP Service exposes it inside the cluster. In an interview I'd walk through it section by section: what runs, how it scales, how it's configured, and how Kubernetes knows it's healthy.`,
      code: `apiVersion: apps/v1
kind: Deployment
metadata: { name: payment-svc, labels: { app: payment-svc } }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: payment-svc } }
  template:
    metadata: { labels: { app: payment-svc } }
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: app
          image: registry.mybank.com/payment-svc:1.4.2
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: payment-config }
            - secretRef:    { name: payment-secrets }
          resources:
            requests: { cpu: "500m", memory: "768Mi" }
            limits:   { memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: payment-svc }
spec:
  selector: { app: payment-svc }
  ports: [{ port: 8080, targetPort: 8080 }]`,
      points: [
        "`maxUnavailable: 0` + `maxSurge: 1` = zero-downtime rollout, one extra pod at a time.",
        "Many teams set a memory limit but no CPU limit to avoid CPU throttling; requests still drive scheduling.",
        "Labels in the selector must match the pod template labels exactly.",
        "Add a PodDisruptionBudget so node maintenance never takes all replicas down."
      ],
      followups: [
        { q: "Why is a startupProbe needed for Spring Boot?", a: "Startup can take 30 to 60 seconds. Without a startup probe, the liveness probe could kill the pod before it ever finishes starting. The startup probe holds the other probes off until the app is up." },
        { q: "How do you spread replicas across nodes or zones?", a: "Use pod anti-affinity or `topologySpreadConstraints`, so losing one node or availability zone doesn't take out all replicas." }
      ]
    },
    {
      id: "ops-configmap-secret",
      title: "ConfigMap & Secret and Spring configuration",
      tag: "must",
      type: "concept",
      answer: `A **ConfigMap** holds non-sensitive configuration like URLs, feature flags and timeouts. A **Secret** holds sensitive values like database passwords and API keys. Both are injected into pods as environment variables or mounted files, which keeps the same image promotable across dev, UAT and prod. Spring Boot picks these up naturally: env vars map through relaxed binding, \`SPRING_DATASOURCE_PASSWORD\` becomes \`spring.datasource.password\`, and mounted files can be imported with \`spring.config.import=configtree:\`. One important point is that Kubernetes Secrets are only **base64-encoded, not encrypted**, so in banking I enable etcd encryption, restrict access with RBAC, and ideally source secrets from Vault or a cloud secret manager.`,
      code: `apiVersion: v1
kind: ConfigMap
metadata: { name: payment-config }
data:
  SPRING_PROFILES_ACTIVE: "prod"
  PAYMENT_LIMITS_DAILY_MAX: "500000"
---
apiVersion: v1
kind: Secret
metadata: { name: payment-secrets }
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "change-me"   # in reality synced from Vault, never in git

# Mounted as files instead:
# spring.config.import: "optional:configtree:/etc/secrets/"`,
      points: [
        "Changing env-var config needs a pod restart; mounted files update in place, but the app must re-read them.",
        "Never commit real Secret YAML to git; use External Secrets Operator, Sealed Secrets or Vault Agent.",
        "Keep environment-specific values out of the image so the same artifact goes to every environment."
      ],
      followups: [
        { q: "How do you roll out a config change safely?", a: "Change the ConfigMap through the pipeline, then trigger a rolling restart (`kubectl rollout restart`, or a config checksum annotation in Helm), so pods pick it up gradually with readiness checks." },
        { q: "ConfigMap vs Spring Cloud Config?", a: "On Kubernetes, ConfigMaps are simpler and native. Spring Cloud Config adds git-backed versioning and runtime refresh, which is useful if you aren't on Kubernetes or need refresh without restarts." }
      ]
    },
    {
      id: "ops-probes",
      title: "Liveness vs readiness vs startup probes",
      tag: "must",
      type: "comparison",
      answer: `The **readiness** probe answers "can this pod take traffic right now?" If it fails, the pod is removed from the Service endpoints but **not restarted**, which suits temporary situations like warming caches or a dependency being slow. The **liveness** probe answers "is the process stuck?" If it fails repeatedly, the kubelet **restarts** the container, so it must check only the app itself and never downstream systems. The **startup** probe protects slow-starting apps by disabling the other two until startup succeeds. Spring Boot Actuator exposes \`/actuator/health/liveness\` and \`/actuator/health/readiness\` automatically on Kubernetes, and I can add checks to the readiness group.`,
      code: `# application.yml
management:
  endpoint:
    health:
      probes:
        enabled: true            # auto-enabled when running on Kubernetes
      group:
        readiness:
          include: readinessState, db   # take pod out of rotation if DB is down
        liveness:
          include: livenessState        # never include DB/Kafka here`,
      points: [
        "Putting the database in the liveness check means a DB outage restarts every pod: a self-inflicted outage.",
        "Readiness goes false during graceful shutdown, so traffic drains before the pod stops.",
        "Tune `failureThreshold` x `periodSeconds` so a long GC pause doesn't trigger a restart."
      ],
      followups: [
        { q: "Should readiness include downstream services?", a: "Only hard dependencies the pod truly can't serve without, like its own database. Including shared downstream services can make all pods unready at once and turn a partial failure into a full outage." },
        { q: "Pods restart every few minutes under load. What would you suspect?", a: "A liveness probe that is too aggressive. Under load, GC pauses or a saturated thread pool make the endpoint slow, so it times out and the pod is killed, which adds even more load. Increase the timeout and threshold, and serve the probe cheaply." }
      ]
    },
    {
      id: "ops-resources-qos",
      title: "Resource requests, limits and QoS classes",
      tag: "must",
      type: "concept",
      answer: `**Requests** are what the scheduler reserves for a pod, and they decide which node it fits on. **Limits** are the hard ceiling. Going over the CPU limit causes **throttling**, which shows up as latency spikes, while going over the memory limit means **OOMKilled**. Based on these, pods get a QoS class: **Guaranteed** when requests equal limits for every resource, **Burstable** when requests are lower than limits, and **BestEffort** when nothing is set. BestEffort pods are evicted first under node pressure. For critical payment services I set memory request equal to the limit, size the heap to about 75% of it, and set a realistic CPU request based on load-test data.`,
      points: [
        "CPU is compressible (throttled), memory is not (killed).",
        "JVM startup is CPU-heavy; a tight CPU limit makes Spring Boot start slowly and fail probes.",
        "Right-size from metrics (Prometheus/VPA recommendations), not guesswork.",
        "Namespace `ResourceQuota` and `LimitRange` enforce team-level budgets."
      ],
      followups: [
        { q: "Why might you remove CPU limits?", a: "CFS throttling can add latency even when the node has spare CPU. Many teams keep CPU requests for fair scheduling but drop CPU limits for latency-sensitive Java services, while always keeping memory limits." },
        { q: "What happens if requests are set too high?", a: "Pods stay Pending because no node has that much unreserved capacity, and the cluster wastes money on reserved but idle resources." }
      ]
    },
    {
      id: "ops-hpa",
      title: "Horizontal Pod Autoscaler",
      tag: "good",
      type: "concept",
      answer: `The **HPA** automatically changes a Deployment's replica count based on metrics, usually CPU utilisation measured against the CPU **request**. It can also scale on custom metrics like requests per second or Kafka consumer lag, through Prometheus Adapter or KEDA. For example, at month-end salary processing, payment pods can scale from 3 to 10 when CPU goes above 70%, then scale back down. It only works if the service is **stateless**, and downstream limits like DB connection pools must be sized for the maximum number of replicas.`,
      code: `apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: payment-svc }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: payment-svc }
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }`,
      points: [
        "HPA needs metrics-server and CPU requests set on the pods.",
        "10 replicas x Hikari pool of 20 = 200 DB connections; check the DB max_connections.",
        "KEDA scales consumers on Kafka lag, and can scale to zero.",
        "VPA adjusts requests/limits; Cluster Autoscaler adds nodes when pods are Pending."
      ],
      followups: [
        { q: "Why scale Kafka consumers on lag instead of CPU?", a: "Consumers waiting on I/O can have low CPU while lag grows. Lag directly measures backlog. Remember that replicas beyond the partition count sit idle." },
        { q: "How do you avoid scaling flapping?", a: "Use the HPA `behavior` settings with stabilisation windows and scale-down policies, so replicas don't go up and down every minute." }
      ]
    },
    {
      id: "ops-rollout-strategies",
      title: "Rolling update, rollback, blue-green and canary",
      tag: "must",
      type: "comparison",
      answer: `A **rolling update**, the Kubernetes default, replaces pods gradually, so there's no downtime and no extra environment. The catch is that old and new versions serve traffic together for a while, so APIs and DB changes must be backward compatible. **Blue-green** runs the full new version beside the old one and switches all traffic at once, which makes rollback instant but needs double capacity. **Canary** sends a small slice of traffic, say 5%, to the new version, watches error rates and latency, then increases it, giving the safest real-world validation. For a critical payment flow I'd prefer canary or blue-green with automated metric checks. Rollback on a plain Deployment is \`kubectl rollout undo\`.`,
      code: `kubectl set image deploy/payment-svc app=registry.mybank.com/payment-svc:1.4.3
kubectl rollout status deploy/payment-svc
kubectl rollout history deploy/payment-svc
kubectl rollout undo deploy/payment-svc              # back to previous revision
kubectl rollout undo deploy/payment-svc --to-revision=7`,
      points: [
        "DB changes use expand-and-contract: add columns first, deploy code, remove old columns in a later release.",
        "Canary is usually implemented with Argo Rollouts, Flagger or a service mesh.",
        "Feature flags decouple deployment from release, so code can ship dark and be switched on later.",
        "A rollback of code doesn't roll back data; plan migrations so the previous version still works."
      ],
      followups: [
        { q: "How do you roll back a release that included a DB migration?", a: "Design migrations to be backward compatible, using additive changes only, so the old code still runs on the new schema. Then rollback is just redeploying the old image. Destructive changes happen in a later release once the new version is stable." },
        { q: "Blue-green vs canary for a banking release?", a: "Blue-green gives instant, simple rollback and is common for big releases. Canary limits the blast radius by exposing only a small percentage of real traffic first. Both rely on good monitoring." }
      ]
    },
    {
      id: "ops-graceful-shutdown",
      title: "Graceful shutdown in Kubernetes",
      tag: "must",
      type: "concept",
      answer: `When a pod is terminated, Kubernetes sends **SIGTERM**, waits \`terminationGracePeriodSeconds\` (30 by default), then sends SIGKILL. With \`server.shutdown=graceful\`, Spring Boot stops accepting new requests, lets in-flight requests finish within \`spring.lifecycle.timeout-per-shutdown-phase\`, and then closes beans such as Kafka consumers and connection pools. The subtle part is a race: the endpoint removal from the Service may happen slightly after SIGTERM, so a few requests can still arrive. A short **preStop** sleep covers that window. For payments, this prevents half-processed requests and duplicate retries on every deployment.`,
      code: `# application.yml
server:
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

# Deployment pod spec
terminationGracePeriodSeconds: 45     # > preStop + Spring timeout
containers:
  - name: app
    lifecycle:
      preStop:
        exec: { command: ["sh", "-c", "sleep 10"] }`,
      points: [
        "Java must be PID 1 (exec-form ENTRYPOINT) to receive SIGTERM.",
        "Grace period must exceed preStop sleep + Spring shutdown timeout.",
        "Kafka consumers should commit offsets on shutdown; processing must still be idempotent.",
        "Readiness goes DOWN during shutdown, so load balancers stop routing to the pod."
      ],
      followups: [
        { q: "What if a request takes longer than the grace period?", a: "It's killed by SIGKILL. Long-running work belongs in async jobs that can resume, with idempotency so retries are safe, not in synchronous HTTP requests." },
        { q: "How do you verify graceful shutdown works?", a: "Run a load test while doing a rolling restart and check that there are zero 5xx errors or connection resets, and that no duplicate transactions appear." }
      ]
    },
    {
      id: "ops-statefulset",
      title: "StatefulSet vs Deployment",
      tag: "good",
      type: "comparison",
      answer: `A **Deployment** is for stateless apps: pods are interchangeable, get random names, and share nothing. A **StatefulSet** is for stateful workloads like Kafka, Zookeeper, Redis or databases. Each pod gets a **stable identity** (\`kafka-0\`, \`kafka-1\`), a stable DNS name through a headless Service, and its **own PersistentVolume** that follows it across restarts. Pods also start and stop in order. My Spring Boot services are always Deployments. For databases and brokers in banking, I'd usually prefer a managed service or a vetted operator over running a hand-made StatefulSet.`,
      points: [
        "PersistentVolumeClaim templates give each replica its own storage.",
        "Headless Service (`clusterIP: None`) gives per-pod DNS like `kafka-0.kafka`.",
        "Operators (Strimzi for Kafka, CloudNativePG) automate upgrades, failover and backups."
      ],
      followups: [
        { q: "Why not run PostgreSQL as a Deployment with a volume?", a: "Replicas would share or fight over one volume, and pods have no stable identity for primary and replica roles. Databases need a StatefulSet or operator, or better, a managed database." },

      tag: "must",
      type: "scenario",
      answer: `**Likely cause:** The pod status tells me where to look. **CrashLoopBackOff** means the app starts and exits repeatedly, usually because of bad config, a missing secret, the database being unreachable, or the liveness probe killing it. **ImagePullBackOff** means a wrong image name or tag, or missing registry credentials. **OOMKilled** means the memory limit was exceeded. **Pending** means the scheduler can't place the pod because of insufficient CPU or memory, node selectors or taints, or an unbound volume.

**How I investigate:** \`kubectl get pods\` for the status and restart count. \`kubectl describe pod\` for events and the last state with its reason and exit code. \`kubectl logs --previous\` for the logs of the crashed container, and \`kubectl get events\` sorted by time.

**Fix:** Correct the config or secret, fix the image tag or imagePullSecret, adjust the memory limit or heap percentage, relax probe timings, or free up or add capacity.

**Prevent:** Validate manifests in CI, use startup probes, right-size resources from metrics, and alert on restart counts.`,

kubectl get events -n payments --sort-by=.lastTimestamp
kubectl top pod -n payments                                 # live CPU / memory
kubectl exec -it payment-svc-7d9f-abcde -n payments -- sh`,

pipeline {

      steps { withSonarQubeEnv('sonar') { sh './mvnw -B sonar:sonar' } }

    stage('Quality Gate') { steps { timeout(time: 10, unit: 'MINUTES') { waitForQualityGate abortPipeline: true } } }
    stage('Image') {
      steps {
        sh "docker build -t \${IMAGE} ."
        sh "trivy image --exit-code 1 --severity HIGH,CRITICAL \${IMAGE}"
        sh "docker push \${IMAGE}"
      }
    }

    stage('Deploy PROD') {
      when { branch 'main' }
      steps {

<dependency><groupId>io.micrometer</groupId><artifactId>micrometer-registry-prometheus</artifactId></dependency>
<dependency><groupId>io.micrometer</groupId><artifactId>micrometer-tracing-bridge-otel</artifactId></dependency>

management:

    {
      id: "ops-git-branching",
      title: "Git branching strategy, merge vs rebase, cherry-pick",
      tag: "must",
      type: "comparison",
      answer: `**GitFlow** uses long-lived \`develop\` and \`main\` branches plus feature, release and hotfix branches. It suits scheduled releases, which is common in banks, but it brings merge overhead. **Trunk-based development** has everyone merging small, short-lived branches into \`main\` daily behind feature flags, which suits CI/CD and frequent releases. **Merge** preserves history and adds a merge commit, while **rebase** replays my commits on top of the target for a linear history. The rule is to rebase only local or private branches and never shared ones. **Cherry-pick** copies a specific commit to another branch, which is how I apply a production hotfix from \`main\` back to a release branch.`,
      code: `# keep a feature branch up to date (private branch only)
git fetch origin
git rebase origin/develop

# hotfix: fix on hotfix branch, then bring the same commit to release/2.3
git checkout release/2.3
git cherry-pick 4f2a9c1

# undo a bad commit that is already pushed (safe for shared history)
git revert 4f2a9c1`,

        "Tag every release (`v1.4.2`) so production can be traced to an exact commit."
      ],
      followups: [
        { q: "Why is rebasing a shared branch dangerous?", a: "Rebase rewrites commit hashes. Teammates who based work on the old commits get diverged histories and painful conflicts, and a force-push can wipe out others' commits." },
        { q: "Which strategy would you choose as a lead?", a: "It depends on the release model. For frequent, automated releases, trunk-based with feature flags. For scheduled, regulated releases with parallel versions in support, a simplified GitFlow with release branches." }
      ]
    }
  ]
});

      tag: "must",
      type: "concept",
      answer: `JUnit 5 is made of three parts: the **Platform** that launches tests, **Jupiter**, the new programming model, and **Vintage**, which runs old JUnit 4 tests. The key annotations are \`@Test\`, \`@BeforeEach\` and \`@AfterEach\`, \`@BeforeAll\` and \`@AfterAll\`, \`@DisplayName\`, \`@Disabled\`, and \`@Nested\` for grouping related scenarios. \`@ParameterizedTest\` with \`@CsvSource\` or \`@MethodSource\` runs one test against many inputs, which is perfect for fee slabs or validation rules. \`assertThrows\` checks exceptions cleanly, and \`assertAll\` reports every failed assertion together instead of stopping at the first.`,
      code: `class FeeCalculatorTest {

    private final FeeCalculator calculator = new FeeCalculator();

    @ParameterizedTest(name = "{0} via {1} -> fee {2}")
    @CsvSource({
        "1000,   UPI,  0.00",
        "1000,   CARD, 20.00",
        "250000, NEFT, 5.00"
    })
    void calculatesFeePerChannel(BigDecimal amount, Channel channel, BigDecimal expected) {
        assertEquals(0, expected.compareTo(calculator.fee(amount, channel)));
    }

    @Nested
    class WhenAmountInvalid {
        @Test
        void rejectsNegativeAmount() {
            IllegalArgumentException ex = assertThrows(IllegalArgumentException.class,
                () -> calculator.fee(new BigDecimal("-1"), Channel.UPI));
            assertEquals("Amount must be positive", ex.getMessage());
        }
    }
}`,

      type: "concept",

        assertTrue(smsCaptor.getValue().text().contains("XXXXXXXX9012"));
        verifyNoMoreInteractions(smsGateway);
    }

    void staticMocking() {
