<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Java Lead Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar + three views (Plan / Study / Revise); Study = module rail + topic accordion */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#eceef3; --line:#dcdfe7; --fg:#1b1f2a; --muted:#5b6274;
  --accent:#2c56c9; --accent-soft:#e3e9fb; --accent-fg:#ffffff;
  --done:#1f7a4d; --done-soft:#dff2e7; --rev:#a5560b; --rev-soft:#fbecd9; --shaky:#b42d3a; --shaky-soft:#f9e1e4;
  --code-bg:#f0f2f7; --k:#7a2fb8; --s:#1f7a4d; --c:#6c7385; --n:#a5560b; --a:#2c56c9; --t:#0d6c86;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --surface:#191d26; --sunk:#222733; --line:#2d3341; --fg:#e7e9ef; --muted:#9aa1b2;
  --accent:#7d9cf5; --accent-soft:#232d4a; --accent-fg:#0e1220;
  --done:#5fcf95; --done-soft:#17352a; --rev:#f0a85c; --rev-soft:#3a2a17; --shaky:#f0808b; --shaky-soft:#3b1d22;
  --code-bg:#151922; --k:#c79bf2; --s:#7fd6a4; --c:#7d8496; --n:#f0b37a; --a:#8fb0ff; --t:#6fd0e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#191d26; --sunk:#222733; --line:#2d3341; --fg:#e7e9ef; --muted:#9aa1b2;
  --accent:#7d9cf5; --accent-soft:#232d4a; --accent-fg:#0e1220;
  --done:#5fcf95; --done-soft:#17352a; --rev:#f0a85c; --rev-soft:#3a2a17; --shaky:#f0808b; --shaky-soft:#3b1d22;
  --code-bg:#151922; --k:#c79bf2; --s:#7fd6a4; --c:#7d8496; --n:#f0b37a; --a:#8fb0ff; --t:#6fd0e6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,pre{font-family:var(--mono)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);margin-left:6px;letter-spacing:.04em}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:9px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted)}
.overall{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);white-space:nowrap}
.bar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bar.done i{background:var(--done)}
.sync{font-family:var(--mono);font-size:11px;color:var(--muted)}

main{padding-block:22px 60px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.15}
h2{font-size:21px}
h3{font-size:16px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* plan view */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;margin-bottom:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.howto{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.howto li{margin:3px 0}
.datebox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-size:14px}
.datebox input{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--bg)}
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.week.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.week header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.week .focus{font-size:13px;color:var(--muted);margin:0}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.mod{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);text-align:left;width:100%}
.mod:hover{border-color:var(--accent)}
.mod .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mod .nm{font-weight:600;font-size:14px;line-height:1.3}
.mod .ct{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.daily{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}

/* study view */
.study{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.rail button{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px;align-items:center;border:0;background:transparent;padding:7px 8px;border-radius:7px;text-align:left;font-size:13.5px}
.rail button:hover{background:var(--sunk)}
.rail button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rail .pc{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail .pc.full{color:var(--done)}
.railsel{display:none;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:12px}
.modhead{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.modhead p{margin:0;color:var(--muted);max-width:70ch}
.modhead .bar{max-width:420px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.topics{display:flex;flex-direction:column;gap:8px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.topic.is-done{border-left:3px solid var(--done)}
.topic.is-rev{border-left:3px solid var(--rev)}
.thead{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:12px 14px;text-align:left}
.thead .tt{font-weight:600;line-height:1.35}
.thead .meta{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.must{background:var(--accent-soft);color:var(--accent)}
.tag.rev{background:var(--rev-soft);color:var(--rev)}
.tag.shaky{background:var(--shaky-soft);color:var(--shaky)}
.tag.ok{background:var(--sunk);color:var(--fg)}
.tag.conf{background:var(--done-soft);color:var(--done)}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center}
.is-done .check{background:var(--done);border-color:var(--done)}
.check svg{width:12px;height:12px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0}
.is-done .check svg{opacity:1}
.tbody{padding:0 16px 16px 46px;display:flex;flex-direction:column;gap:14px;min-width:0}
.answer{font-size:15.5px;line-height:1.65;max-width:75ch;margin:0}
.answer code,.points code,.fu code{background:var(--sunk);padding:1px 5px;border-radius:4px;font-size:.88em}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.points{margin:0;padding-left:18px;max-width:75ch}
.points li{margin:4px 0}
.codebox{position:relative;min-width:0}
.codebox pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.55;tab-size:4}
.codebox .copy{position:absolute;top:6px;right:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:12px;padding:3px 9px;color:var(--muted)}
.out pre{background:transparent;border-style:dashed}
.hk{color:var(--k)} .hs{color:var(--s)} .hc{color:var(--c);font-style:italic} .hn{color:var(--n)} .ha{color:var(--a)} .ht{color:var(--t)}
.fu{border-top:1px solid var(--line);padding-top:8px}
.fu details{border-bottom:1px solid var(--line);padding:7px 0}
.fu summary{cursor:pointer;font-weight:500}
.fu details p{margin:6px 0 2px;color:var(--muted);max-width:75ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.on-done{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.btn.on-rev{background:var(--rev-soft);border-color:var(--rev);color:var(--rev)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-c="1"]{background:var(--shaky-soft);color:var(--shaky)}
.seg button[aria-pressed="true"][data-c="2"]{background:var(--sunk);color:var(--fg)}
.seg button[aria-pressed="true"][data-c="3"]{background:var(--done-soft);color:var(--done)}
.note{width:100%;min-height:62px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);resize:vertical;font-size:14px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* revise view */
.rev-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card .q{font-family:var(--display);font-size:24px;line-height:1.2}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.revlist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.revlist button{border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:6px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.revlist button:hover{background:var(--sunk)}

@media (max-width:900px){
  .hero,.rev-grid{grid-template-columns:minmax(0,1fr)}
  .weeks{grid-template-columns:repeat(2,minmax(0,1fr))}
  .study{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .railsel{display:block}
}
@media (max-width:560px){
  .weeks{grid-template-columns:minmax(0,1fr)}
  .top{position:static}
  .overall .bar{display:none}
  .tbody{padding-left:16px}
  .thead .meta .tag:not(.must):not(.rev){display:none}
  h1{font-size:23px}
  .card .q{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">Java Lead Prep<small>CORE JAVA · SPRING · LEAD</small></div>

<script>
window.PREP = { modules: [] };
PREP.modules.push({
  id: "oop",
  num: 1,
  title: "OOP & Java Fundamentals",
  blurb: "The foundation every other answer builds on: how Java runs, the four OOP pillars, and the language rules interviewers use to separate experienced developers from textbook readers.",
  topics: [
    {
      id: "oop-what-is-java",
      title: "What is Java? JDK vs JRE vs JVM",
      tag: "must",
      type: "comparison",
      answer: `Java is a statically typed, object-oriented, platform-independent language. Source code is compiled into bytecode, and that bytecode runs on the JVM, which gives us "write once, run anywhere". The **JDK** is the full development kit: the compiler \`javac\`, tools like \`jstack\` and \`jcmd\`, plus a runtime. The **JRE** is just the runtime needed to run programs. The **JVM** is the engine that loads, verifies and executes bytecode, with JIT compilation and garbage collection.`,
      points: [
        "Bytecode is platform-independent; the JVM itself is platform-specific.",
        "Since Java 11 there is no separate JRE download; we ship the JDK or build a trimmed runtime with jlink.",
        "The JIT compiles hot methods to native code, which is why Java gets faster after warm-up."
      ],
      followups: [
        { q: "Is Java fully object-oriented?", a: "Not purely, because it has primitive types like int and boolean and static members that don't belong to an object. Wrapper classes and autoboxing bridge primitives into the object world." },
        { q: "Is Java compiled or interpreted?", a: "Both. javac compiles to bytecode, then the JVM interprets it initially and JIT-compiles frequently executed code to native machine code at runtime." }
      ]
    },
    {
      id: "oop-class-object",
      title: "Class and object",
      tag: "must",
      type: "concept",
      answer: `A class is a blueprint that defines state (fields) and behaviour (methods). An object is a runtime instance of that class, created with \`new\` and allocated on the heap, with its own copy of instance fields. Static members belong to the class and are shared across all objects. In enterprise code I keep classes focused on one responsibility and keep fields private, so business rules can't be bypassed.`,
      code: `public class Account {
    private final String accountId;      // state
    private BigDecimal balance;

    public Account(String accountId, BigDecimal openingBalance) {
        this.accountId = accountId;
        this.balance = openingBalance;
    }

    public void debit(BigDecimal amount) { // behaviour guards the state
        if (balance.compareTo(amount) < 0) {
            throw new IllegalStateException("Insufficient funds");
        }
        balance = balance.subtract(amount);
    }
}`,
      followups: [
        { q: "What are the ways to create an object in Java?", a: "new keyword, reflection (Constructor.newInstance), clone(), deserialization, and factory or builder methods that use one of these internally." },
        { q: "Where are objects and references stored?", a: "Objects live on the heap. Local reference variables live on the thread's stack and point to the heap object." }
      ]
    },
    {
      id: "oop-four-pillars",
      title: "Four pillars of OOP",
      tag: "must",
      type: "concept",
      answer: `The four pillars are encapsulation, abstraction, inheritance and polymorphism. **Encapsulation** hides internal state behind methods. **Abstraction** exposes what an object does, not how, through interfaces and abstract classes. **Inheritance** lets a class reuse and specialise another class. **Polymorphism** lets one interface have many implementations chosen at runtime. Together they give us code that is easier to extend and maintain, which matters in long-lived banking systems.`,
      points: [
        "Encapsulation: private balance, public debit()/credit() with validation.",
        "Abstraction: PaymentProcessor interface; callers don't know about UPI or card internals.",
        "Inheritance: SavingsAccount extends Account.",
        "Polymorphism: processor.process(amount) runs the right implementation at runtime."
      ],
      followups: [
        { q: "Encapsulation vs abstraction?", a: "Encapsulation is about hiding data and protecting invariants (implementation level). Abstraction is about hiding complexity and exposing only the essential contract (design level)." },
        { q: "Which pillar matters most in your design work?", a: "Abstraction through interfaces, because programming to interfaces enables dependency injection, testing with mocks, and adding new implementations without changing callers." }
      ]
    },
    {
      id: "oop-encapsulation",
      title: "Encapsulation",
      tag: "must",
      type: "concept",
      answer: `Encapsulation means bundling data with the methods that operate on it and restricting direct access with private fields. The object controls its own invariants, for example a balance can only change through \`debit()\` or \`credit()\`, which validate the amount. That reduces bugs, makes refactoring safer because the internal representation can change, and supports thread-safety since all access goes through controlled methods.`,
      code: `public class Wallet {
    private BigDecimal balance = BigDecimal.ZERO;

    public synchronized void credit(BigDecimal amount) {
        if (amount.signum() <= 0) throw new IllegalArgumentException("Amount must be positive");
        balance = balance.add(amount);
    }

    public synchronized BigDecimal getBalance() { return balance; } // no setter
}`,
      points: [
        "Generating getters and setters for every field is not encapsulation; expose behaviour, not data.",
        "Return defensive copies of mutable fields like Date or List."
      ],
      followups: [
        { q: "Is a class with all private fields and public getters/setters encapsulated?", a: "Only technically. If any caller can set any value, the invariants aren't protected. Real encapsulation exposes intention-revealing methods with validation." }
      ]
    },
    {
      id: "oop-inheritance",
      title: "Inheritance and the diamond problem",
      tag: "must",
      type: "concept",
      answer: `Inheritance lets a subclass reuse and extend a parent class using \`extends\`, modelling an IS-A relationship. Java allows only single class inheritance to avoid the diamond problem, where two parents have the same method and the compiler can't decide which one to inherit. A class can implement multiple interfaces. Since Java 8, if two interfaces provide the same default method, the class must override it and can pick one explicitly with \`InterfaceName.super.method()\`.`,
      code: `interface Auditable { default String describe() { return "auditable"; } }
interface Notifiable { default String describe() { return "notifiable"; } }

class Payment implements Auditable, Notifiable {
    @Override
    public String describe() {               // compiler forces this override
        return Auditable.super.describe() + "+" + Notifiable.super.describe();
    }
}`,
      points: [
        "Types of inheritance in Java: single, multilevel, hierarchical; multiple only via interfaces.",
        "Constructors and private members are not inherited.",
        "Deep hierarchies are fragile; prefer composition for code reuse."
      ],
      followups: [
        { q: "What is the fragile base class problem?", a: "A change in a parent class can silently break subclasses that depend on its internal behaviour. That's why we keep hierarchies shallow, make classes final unless designed for extension, and prefer composition." },
        { q: "Can we override a static method?", a: "No. A static method with the same signature in the subclass hides the parent method; the call is resolved by reference type at compile time." }
      ]
    },
    {
      id: "oop-polymorphism",
      title: "Polymorphism: overloading vs overriding",
      tag: "must",
      type: "comparison",
      answer: `Polymorphism means one interface, many implementations. **Overloading** is compile-time polymorphism: same method name, different parameter list, resolved by the compiler. **Overriding** is runtime polymorphism: a subclass provides its own implementation of an inherited method, and the JVM picks it through dynamic dispatch based on the actual object type. Spring DI relies on overriding when it injects a different implementation behind an interface.`,
      code: `public class PolymorphismDemo {
    static class Payment {
        String process() { return "generic payment"; }
    }
    static class UpiPayment extends Payment {
        @Override String process() { return "UPI payment"; }
    }
    // overloading: same name, different parameters
    static String fee(int amount) { return "int fee"; }
    static String fee(long amount) { return "long fee"; }

    public static void main(String[] args) {

    private static final int MAX = 10;

        Thread even = new Thread(() -> print(0), "Even");
        odd.start();
        even.start();
        odd.join();
        even.join();
    }

    private static void print(int remainder) {
        synchronized (lock) {
            while (counter <= MAX) {
                if (counter % 2 == remainder) {
                    System.out.println(Thread.currentThread().getName() + ": " + counter);
                    counter++;
                    lock.notify();
                } else {
                    try {
                        lock.wait();
                    } catch (InterruptedException e) {

                    }

    protected Long compute() {
        if (to - from <= 10_000) {                 // small enough: compute directly
            long sum = 0;
            for (int i = from; i < to; i++) sum += data[i];
            return sum;
        }
        int mid = (from + to) / 2;
        SumTask left = new SumTask(data, from, mid);
        left.fork();                               // async
        long right = new SumTask(data, mid, to).compute();

      id: "j8-collectors",
      title: "Collectors: groupingBy, partitioningBy, toMap, joining",

      answer: `\`Collectors\` provides ready-made reductions for the \`collect\` terminal operation. \`groupingBy\` builds a Map of key to list, with downstream collectors like \`counting()\`, \`summingDouble()\` or \`mapping()\`. \`partitioningBy\` splits into true and false groups, \`toMap\` builds a custom map, and \`joining\` concatenates strings. A typical banking use is a report of total amount per transaction channel; I pass \`TreeMap::new\` when I need sorted, predictable output.`,
      code: `import java.util.*;
import java.util.stream.*;

public class CollectorsDemo {

    public static void main(String[] args) {

                new Txn("T4", "NEFT", 75000, true),
                new Txn("T5", "CARD", 3000, true));

                .collect(Collectors.groupingBy(t -> t.channel, TreeMap::new, Collectors.counting()));
        System.out.println("Count by channel : " + countByChannel);

        Map<String, Double> totalByChannel = txns.stream()
                .collect(Collectors.groupingBy(t -> t.channel, TreeMap::new, Collectors.summingDouble(t -> t.amount)));
        System.out.println("Total by channel : " + totalByChannel);

        Map<Boolean, List<String>> bySuccess = txns.stream()
                .collect(Collectors.partitioningBy(t -> t.success,
                         Collectors.mapping(t -> t.id, Collectors.toList())));
        System.out.println("Partitioned      : " + bySuccess);

        Map<String, Double> idToAmount = txns.stream()
                .collect(Collectors.toMap(t -> t.id, t -> t.amount, (a, b) -> a, LinkedHashMap::new));
        System.out.println("toMap            : " + idToAmount);

        String ids = txns.stream().map(t -> t.id).collect(Collectors.joining(", ", "[", "]"));
        System.out.println("Joined ids       : " + ids);
    }
}`,

      answer: `StackOverflowError happens when a thread's stack runs out of space, almost always from infinite or very deep recursion. Common real causes are a recursive method without a correct base case, bidirectional JPA relationships causing infinite recursion in \`toString()\` or Jackson serialisation, and cyclic \`equals()\` or \`hashCode()\` calls. I fix the root cause, for example using \`@JsonManagedReference\`/\`@JsonBackReference\` or DTOs, or convert deep recursion to iteration. Increasing \`-Xss\` only hides the problem.`,

      tag: "must",
      type: "concept",
      answer: `The JVM starts by interpreting bytecode, and profiles which methods and loops run often. The Just-In-Time compiler then compiles those hot spots into optimised native code. HotSpot uses tiered compilation: C1 compiles quickly with light optimisation, and C2 later recompiles the hottest code with aggressive optimisations like inlining, escape analysis and loop unrolling. That's why Java services need warm-up and why benchmarks should use JMH rather than simple timing loops.`,

      id: "jvm-tools",
      title: "Diagnostic tools",
      tag: "must",
      type: "concept",
      answer: `For production diagnosis I use \`jcmd\` as the all-in-one tool: thread dumps, heap dumps, GC info and starting Java Flight Recorder. \`jstack\` takes thread dumps to find deadlocks, blocked or busy threads. \`jmap\` and heap dumps analysed in **Eclipse MAT** find memory leaks through the dominator tree. **JFR** with JDK Mission Control is low-overhead profiling safe for production. **VisualVM** is handy locally. Alongside these, APM tools and Micrometer metrics in Prometheus/Grafana show trends over time.`,

jcmd <pid> GC.heap_dump /tmp/heap.hprof         # heap dump
jcmd <pid> GC.heap_info

jstat -gcutil <pid> 1000                        # GC stats every second`,

    },
    {
      id: "jvm-references",
      title: "Strong, soft, weak and phantom references",
      tag: "good",
      type: "comparison",
      answer: `A **strong** reference is a normal reference; the object is never collected while it's reachable. A **soft** reference is collected only when the JVM is low on memory, which suits memory-sensitive caches. A **weak** reference is collected at the next GC once no strong references remain; WeakHashMap and ThreadLocalMap keys use them. A **phantom** reference is enqueued after the object is finalised and is used for post-mortem cleanup, which is how \`Cleaner\` replaces finalize().`,

private static final DateTimeFormatter FMT = DateTimeFormatter.ofPattern("dd-MM-yyyy");`,

      ]
    }
  ]
});

      id: "rest-idempotency-key",
      title: "Idempotency keys for payments",
      tag: "must",
      type: "design",
      answer: `Networks fail: a client can send a payment, time out, and retry, and without protection the customer is debited twice. So the client sends a unique **Idempotency-Key** header per logical payment. On the server I store the key with the request hash and the result, enforced by a unique constraint. If the same key comes again, I return the stored response instead of processing again; if it's still in progress I return 409. Keys expire after a retention window, like 24 hours.`,
      code: `@PostMapping("/payments")
public ResponseEntity<PaymentDto> pay(@RequestHeader("Idempotency-Key") String key,
                                      @Valid @RequestBody PaymentRequest req) {
    Optional<IdempotencyRecord> existing = idemRepo.findById(key);
    if (existing.isPresent()) {
        return existing.get().toResponse();         // replay stored result, no new debit
    }
    idemRepo.save(IdempotencyRecord.inProgress(key, hash(req)));  // unique PK -> concurrent dup fails
    PaymentDto result = paymentService.process(req);
    idemRepo.save(IdempotencyRecord.completed(key, result));
    return ResponseEntity.status(HttpStatus.CREATED).body(result);
}`,
      points: [
        "The unique constraint in the DB is the real guard; an in-memory check alone has race conditions.",
        "Same key with a different payload should be rejected (422/409).",
        "Downstream consumers (Kafka) need the same idea: dedupe by message/transaction id."
      ],
      followups: [
        { q: "Who generates the key?", a: "The client, typically a UUID per user action, so a retry of the same action reuses the same key." },
        { q: "What if the server crashes after debiting but before saving the result?", a: "Do the debit and the idempotency record update in the same DB transaction, so either both happen or neither." }
      ]
    },
    {
      id: "rest-openapi",
      title: "OpenAPI / Swagger documentation",
      tag: "good",
      type: "concept",
      answer: `OpenAPI is the standard spec for describing REST APIs: endpoints, request and response schemas, status codes and security. In Spring Boot I use springdoc-openapi, which generates the spec from controllers and annotations and serves Swagger UI. For APIs consumed by other teams I prefer **contract-first**: agree the YAML spec, generate interfaces and clients, and run contract tests, so integration problems surface early instead of in UAT.`,
      code: `<dependency>
  <groupId>org.springdoc</groupId>
  <artifactId>springdoc-openapi-starter-webmvc-ui</artifactId>
</dependency>

@Operation(summary = "Get account by id")
@ApiResponse(responseCode = "404", description = "Account not found")
@GetMapping("/{id}")
public AccountDto get(@PathVariable String id) { ... }
// UI at /swagger-ui.html, spec at /v3/api-docs`,
      followups: [
        { q: "Code-first vs contract-first?", a: "Code-first is faster for internal APIs; contract-first is better when several teams build against the API in parallel." },
        { q: "Would you expose Swagger UI in production?", a: "Usually not publicly; I disable it or protect it behind authentication in prod." }
      ]
    },
    {
      id: "rest-monolith-vs-micro",
      title: "Monolith vs microservices",
      tag: "must",
      type: "comparison",
      answer: `A monolith is one deployable unit: simple to build, test, deploy and debug, with local transactions. Microservices split the system into independently deployable services, giving independent scaling, team autonomy and fault isolation, but adding network latency, distributed transactions, and much heavier ops and monitoring. I'd choose microservices when there are several teams, clearly separate domains and different scaling needs. For a small team or an unclear domain, I'd start with a well-modularized monolith and extract services later.`,
      points: [
        "Microservices trade code complexity for distributed-systems complexity.",
        "Prerequisites: CI/CD, containers, monitoring, tracing, automated tests.",
        "Distributed monolith (services that must deploy together) is the worst of both.",
        "Strangler fig pattern for migrating a legacy monolith incrementally."
      ],
      followups: [
        { q: "How would you migrate a monolith?", a: "Strangler fig: put a gateway in front, extract one bounded context at a time (often a low-risk, high-change one), route its traffic to the new service, and retire the old code." },
        { q: "How small should a microservice be?", a: "Sized by business capability and team ownership, not lines of code. If two services always change and deploy together, they should probably be one." }
      ]
    },
    {
      id: "rest-decomposition",
      title: "Microservice decomposition (DDD bounded contexts)",
      tag: "good",
      type: "design",
      answer: `I decompose by business capability using Domain-Driven Design. A **bounded context** is a boundary where a model and its language are consistent, for example "Account", "Payments", "Customer/KYC" and "Notifications" in a bank. Each context becomes a candidate service that owns its data. Good boundaries mean high cohesion inside and few chatty calls across; if a single user action needs five synchronous calls, the boundary is probably wrong.`,
      points: [
        "Same word, different meaning per context: 'customer' in KYC vs in Cards.",
        "Each service owns its tables; others access via API or events.",
        "Avoid splitting by technical layer (a 'DAO service')."
      ],
      followups: [
        { q: "What's an aggregate?", a: "A cluster of entities treated as one consistency unit with a root, e.g. Account with its holds; invariants are enforced inside one transaction on the aggregate." },
        { q: "How do contexts communicate?", a: "Through published APIs or domain events, with an anti-corruption layer where a legacy model must be translated." }
      ]
    },
    {
      id: "rest-api-gateway",
      title: "API gateway",
      tag: "must",
      type: "concept",
      answer: `An API gateway is the single entry point for clients in front of the microservices. It handles cross-cutting concerns once: routing, authentication and token validation, rate limiting, SSL termination, request logging and correlation ids, and sometimes response aggregation. Examples are Spring Cloud Gateway, Kong, or a cloud gateway. The trade-off is that it's an extra hop and a potential single point of failure, so it must be highly available and kept free of business logic.`,
      code: `spring:
  cloud:
    gateway:
      routes:
        - id: payments
          uri: lb://payment-service        # load-balanced via discovery
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: RequestRateLimiter`,
      followups: [
        { q: "What is the BFF pattern?", a: "Backend-for-Frontend: a separate gateway layer per client type (mobile, web) that shapes and aggregates responses for that client." },
        { q: "Gateway vs load balancer?", a: "A load balancer distributes traffic across instances at L4/L7; a gateway is API-aware: routing by path, auth, rate limits, transformations." }
      ]
    },
    {
      id: "rest-discovery-lb",
      title: "Service discovery & load balancing",
      tag: "good",
      type: "concept",
      answer: `In microservices, instances scale up and down, so hard-coded hosts don't work. Service discovery keeps a registry of healthy instances: services register themselves, like with Eureka or Consul, and clients look them up by name. Client-side load balancing, such as Spring Cloud LoadBalancer, then spreads calls across instances. On Kubernetes this is mostly built in: a Service gets a stable DNS name and kube-proxy load-balances to healthy pods, so Eureka often isn't needed.`,
      followups: [
        { q: "Client-side vs server-side load balancing?", a: "Client-side: the caller picks an instance from the registry (no extra hop). Server-side: a load balancer or K8s Service picks it (simpler clients)." },
        { q: "How are unhealthy instances removed?", a: "Health checks/heartbeats; in Kubernetes, readiness probes remove a pod from the Service endpoints until it is ready." }
      ]
    },
    {
      id: "rest-sync-vs-async",
      title: "Sync REST/Feign vs async messaging (Kafka)",
      tag: "must",
      type: "comparison",
      answer: `Synchronous REST, often through Feign or WebClient, is simple and gives an immediate answer, but it couples services in time: if the downstream is slow or down, the caller is too. Asynchronous messaging with Kafka or RabbitMQ decouples them; the producer publishes an event and carries on, and consumers process at their own pace with retries. I use sync calls when the user needs the answer now, like a balance check, and events for side effects like notifications, audit, and statement updates.`,
      code: `@FeignClient(name = "account-service")
public interface AccountClient {
    @GetMapping("/api/v1/accounts/{id}/balance")
    BalanceDto balance(@PathVariable("id") String id);
}

// Async: publish and move on
kafkaTemplate.send("payment-events", payment.getAccountId(), new PaymentCompleted(payment.getId()));`,
      followups: [
        { q: "Downsides of async?", a: "Eventual consistency, harder debugging and ordering, duplicate delivery, and you need DLQs and monitoring of consumer lag." },
        { q: "Kafka vs RabbitMQ?", a: "Kafka is a durable, partitioned log built for high throughput and replay; RabbitMQ is a traditional broker with flexible routing and per-message acks, good for task queues." }
      ]
    },
    {
      id: "rest-kafka",
      title: "Kafka essentials",
      tag: "must",
      type: "concept",
      answer: `Kafka is a distributed, durable event log. A **topic** is split into **partitions**; ordering is guaranteed only within a partition, so I use the account id as the message key so all events for one account stay in order. Consumers in a **consumer group** share partitions, with at most one consumer per partition, which is how we scale. Consumers track **offsets**; committing after processing gives at-least-once delivery, so consumers must be **idempotent**, for example by deduping on the transaction id.`,
      code: `@KafkaListener(topics = "payment-events", groupId = "notification-service")
public void onPayment(PaymentEvent event) {
    if (processedRepo.existsById(event.getEventId())) {
        return;                                  // duplicate delivery, skip
    }
    notificationService.send(event);
    processedRepo.save(new ProcessedEvent(event.getEventId()));
}`,
      points: [
        "Max parallelism in a group = number of partitions.",
        "Retention-based: messages stay after consumption and can be replayed.",
        "Producer reliability: acks=all, enable.idempotence=true.",
        "Poison messages: retry topics plus a dead-letter topic (DLT)."
      ],
      followups: [
        { q: "How do you get exactly-once?", a: "Kafka transactions give exactly-once within Kafka read-process-write; with external DBs I rely on at-least-once plus idempotent consumers, which is simpler and reliable." },
        { q: "What happens during a rebalance?", a: "Partitions are reassigned when consumers join or leave; uncommitted messages may be reprocessed, another reason consumers must be idempotent." }
      ]
    },
    {
      id: "rest-resilience",
      title: "Circuit breaker, retry, timeout & bulkhead",
      tag: "must",
      type: "concept",
      answer: `These patterns stop one failing dependency from taking the whole system down. A **timeout** bounds how long we wait. **Retry** with exponential backoff handles transient failures, only for idempotent calls. A **circuit breaker** opens after a failure threshold and fails fast with a fallback, then half-opens to test recovery. A **bulkhead** limits concurrent calls to one dependency so it can't exhaust all threads. In Spring Boot I use Resilience4j.`,
      code: `@CircuitBreaker(name = "fraudService", fallbackMethod = "fraudFallback")
@Retry(name = "fraudService")
@Bulkhead(name = "fraudService")
public FraudResult check(Payment p) {
    return fraudClient.check(p);
}

private FraudResult fraudFallback(Payment p, Throwable t) {
    return FraudResult.manualReview(p.getId());   // safe default, not 'approved'
}

# application.yml
resilience4j.circuitbreaker.instances.fraudService:
  failureRateThreshold: 50
  slidingWindowSize: 20
  waitDurationInOpenState: 30s`,
      followups: [
        { q: "Circuit breaker states?", a: "Closed (calls pass, failures counted), Open (fail fast for a wait duration), Half-open (a few trial calls decide whether to close or re-open)." },
        { q: "Danger of retries?", a: "Retry storms that amplify load on a struggling service; use backoff with jitter, limit attempts, and never retry non-idempotent calls without an idempotency key." }
      ]
    },
    {
      id: "rest-saga-outbox",
      title: "Saga & outbox patterns",
      tag: "must",
      type: "design",
      answer: `With a database per service, one business transaction can't use a single ACID transaction, and 2PC doesn't scale well. A **Saga** splits it into local transactions, each with a **compensating action** if a later step fails, like reversing a debit. In choreography, services react to each other's events; in orchestration, a central orchestrator drives the steps, which is easier to follow for complex flows. The **outbox pattern** solves the dual-write problem: I write the business change and the event to an outbox table in the same local transaction, and a relay or CDC (Debezium) publishes it to Kafka.`,
      code: `@Transactional
public void debit(DebitCommand cmd) {
    Account acc = accountRepo.findById(cmd.accountId()).orElseThrow();
    acc.debit(cmd.amount());
    outboxRepo.save(new OutboxEvent("AccountDebited", cmd.paymentId(), toJson(cmd)));
    // both rows commit together; a poller/Debezium publishes outbox rows to Kafka
}`,
      points: [
        "Compensation is a business undo (refund/reversal), not a DB rollback.",
        "Choreography: loose coupling but flow is implicit; orchestration: explicit flow, central logic.",
        "Without outbox: DB commit succeeds and Kafka send fails (or the reverse), causing inconsistency."
      ],
      followups: [
        { q: "Why not 2PC?", a: "It blocks resources while waiting on the coordinator, reduces availability, and isn't supported by Kafka or most cloud datastores." },
        { q: "What if a compensation fails?", a: "Retry it (it must be idempotent), and if it still fails, alert and move to a manual reconciliation queue." }
      ]
    },
    {
      id: "rest-tracing",
      title: "Distributed tracing & correlation IDs",
      tag: "must",
      type: "concept",
      answer: `In microservices one request touches many services, so I need to follow it end to end. A **correlation or trace id** is generated at the edge and propagated through HTTP headers and Kafka message headers; every log line includes it through MDC. In Spring Boot 3, Micrometer Tracing with OpenTelemetry or Zipkin does this automatically and also records spans with timings, so I can see which hop was slow.`,
      code: `// Logback pattern prints trace ids from MDC
<pattern>%d %-5level [%X{traceId},%X{spanId}] %logger - %msg%n</pattern>

// Manual fallback filter if no tracing library
public class CorrelationFilter extends OncePerRequestFilter {
    protected void doFilterInternal(HttpServletRequest req, HttpServletResponse res, FilterChain chain)
            throws ServletException, IOException {
        String id = Optional.ofNullable(req.getHeader("X-Correlation-Id")).orElse(UUID.randomUUID().toString());
        MDC.put("correlationId", id);
        res.setHeader("X-Correlation-Id", id);
        try { chain.doFilter(req, res); } finally { MDC.clear(); }
    }
}`,
      followups: [
        { q: "Why MDC.clear in finally?", a: "Servlet threads are pooled; without clearing, the next request on that thread would log the wrong correlation id." },
        { q: "How does it work with @Async or thread pools?", a: "MDC is thread-local, so it must be copied to the worker thread, e.g. with a TaskDecorator or context-propagation support in Micrometer." }
      ]
    },
    {
      id: "rest-config",
      title: "Centralized configuration",
      tag: "good",
      type: "concept",
      answer: `Configuration should live outside the build artifact, so the same JAR runs in dev, UAT and prod. Options are Spring Cloud Config Server backed by Git, or Kubernetes ConfigMaps and Secrets, with Spring profiles for environment differences. Secrets like DB passwords and keys go into a vault such as HashiCorp Vault or a cloud secret manager, never into Git. For changes without a restart, \`@RefreshScope\` or config reload can be used, but I keep that limited to safe settings like feature flags.`,
      code: `@ConfigurationProperties(prefix = "payment.limits")
public record PaymentLimits(BigDecimal upiDaily, BigDecimal impsPerTxn) { }

# application-prod.yml
payment:
  limits:
    upi-daily: 100000
    imps-per-txn: 500000`,
      followups: [
        { q: "@Value vs @ConfigurationProperties?", a: "@ConfigurationProperties binds a group of typed, validated properties into one object; @Value is fine for a single value but scatters config." },
        { q: "Where do secrets go?", a: "A vault or K8s Secrets (ideally encrypted at rest / external secrets), injected as env vars or mounted files, never committed." }
      ]
    },
    {
      id: "rest-db-per-service",
      title: "Database per service & eventual consistency",
      tag: "must",
      type: "design",
      answer: `Each microservice owns its data, and no other service reads its tables directly; otherwise schemas get coupled and we lose independent deployment. The consequence is that data spanning services is **eventually consistent**: the payment service records the payment, publishes an event, and the statement service updates later. I make this safe with idempotent consumers, the outbox pattern, sagas for multi-step flows, and reconciliation jobs, and I design the UI for it, for example showing a payment as "processing".`,
      followups: [
        { q: "How do you query data across services?", a: "API composition for simple cases, or CQRS: build a read model from events in a store designed for that query." },
        { q: "When is strong consistency mandatory?", a: "Within one aggregate, like an account balance and its debit; keep that inside one service and one local transaction." }
      ]
    },
    {
      id: "rest-redis-cache",
      title: "Caching with Redis",
      tag: "must",
      type: "concept",
      answer: `Caching reduces DB load and latency for data that is read often and changes rarely, like product configs, IFSC codes or customer profiles. In Spring I use the cache abstraction with Redis as a shared distributed cache, so all instances see the same data. The hard part is invalidation: I set TTLs, evict on update, and never cache data that must be exact, like a live balance used for a debit decision.`,
      code: `@Cacheable(value = "ifsc", key = "#code")
public BankBranch findBranch(String code) { return branchRepo.findByIfsc(code); }

@CacheEvict(value = "customer", key = "#c.id")
public Customer update(Customer c) { return customerRepo.save(c); }`,
      points: [
        "Patterns: cache-aside (most common), write-through, write-behind.",
        "Risks: stale data, cache stampede (use locking or early refresh), memory growth (TTL + eviction policy).",
        "Local cache (Caffeine) is faster but per-instance; Redis is shared."
      ],
      followups: [
        { q: "Why might @Cacheable not work?", a: "Self-invocation: calling the method from inside the same class bypasses the Spring proxy; also needs @EnableCaching." },
        { q: "What is a cache stampede?", a: "When a hot key expires and many requests hit the DB at once; fix with a lock per key, request coalescing, or refreshing before expiry." }
      ]
    },
    {
      id: "rest-docker-k8s",
      title: "Docker & Kubernetes basics for Java devs",
      tag: "good",
      type: "concept",
      answer: `Docker packages the app with its runtime into an image, so it runs the same everywhere. Kubernetes runs those containers at scale: **Deployments** manage replicas and rolling updates, **Services** give stable networking, **ConfigMaps/Secrets** hold config, and the **HPA** scales on CPU or custom metrics. For Java specifically, I set memory with \`-XX:MaxRAMPercentage\` so the JVM respects container limits, and expose readiness and liveness probes through Spring Boot Actuator.`,
      code: `FROM eclipse-temurin:17-jre
COPY target/payment-service.jar app.jar
ENTRYPOINT ["java", "-XX:MaxRAMPercentage=75", "-jar", "/app.jar"]

# k8s probes
readinessProbe:
  httpGet: { path: /actuator/health/readiness, port: 8080 }
livenessProbe:
  httpGet: { path: /actuator/health/liveness, port: 8080 }`,
      followups: [
        { q: "Readiness vs liveness?", a: "Readiness says whether the pod should receive traffic (e.g. during startup); liveness says whether it is stuck and should be restarted." },
        { q: "Why OOMKilled even though heap looks fine?", a: "The container limit covers the whole process: heap plus metaspace, thread stacks and direct buffers. Leave headroom by keeping heap around 70-75% of the limit." }
      ]
    },
    {
      id: "rest-12factor",
      title: "12-factor app",
      tag: "good",
      type: "concept",
      answer: `The 12-factor methodology is a set of practices for cloud-ready services. The ones I stress most are: config in the environment, not in code; stateless processes, so instances are disposable and can scale out; backing services like DBs and queues treated as attached resources; logs written to stdout as event streams; and dev/prod parity. Spring Boot with containers supports these naturally.`,
      followups: [
        { q: "Why log to stdout?", a: "The platform (K8s, Fluentd/Fluent Bit) collects and ships logs centrally; the app shouldn't manage log files and rotation." },
        { q: "What does 'disposability' mean?", a: "Fast startup and graceful shutdown, so instances can be killed and replaced safely; Spring Boot supports server.shutdown=graceful." }
      ]
    }
  ]
});

  id: "sql",
  num: 12,
  title: "SQL, Database & Transactions",
  blurb: "ACID, isolation, indexing, query tuning and classic SQL questions that come up alongside every Java backend interview.",
  topics: [
    {
      id: "sql-acid",
      title: "ACID properties",
      tag: "must",
      type: "concept",
      answer: `**Atomicity**: all statements in a transaction succeed or none do, so a transfer never debits without crediting. **Consistency**: the transaction moves the DB from one valid state to another, respecting constraints. **Isolation**: concurrent transactions don't see each other's intermediate state, to the degree set by the isolation level. **Durability**: once committed, data survives crashes, thanks to the write-ahead or redo log.`,
      code: `BEGIN;
UPDATE accounts SET balance = balance - 5000 WHERE account_no = 'A100' AND balance >= 5000;
UPDATE accounts SET balance = balance + 5000 WHERE account_no = 'B200';
INSERT INTO txn_ledger(from_acc, to_acc, amount) VALUES ('A100', 'B200', 5000);
COMMIT;   -- or ROLLBACK if any step fails`,
      followups: [
        { q: "How does Spring map to ACID?", a: "@Transactional demarcates the transaction boundary; the database actually provides atomicity, isolation and durability." },
        { q: "Is ACID guaranteed across two microservices' databases?", a: "No, each local transaction is ACID, but across services you need sagas with compensation, giving eventual consistency." }
      ]
    },
    {
      id: "sql-isolation",
      title: "Isolation levels and read anomalies",
      tag: "must",
      type: "concept",
      answer: `Isolation levels trade consistency for concurrency. **Read Uncommitted** allows dirty reads. **Read Committed**, the default in Oracle, PostgreSQL and SQL Server, prevents dirty reads but allows non-repeatable reads. **Repeatable Read**, MySQL InnoDB's default, also prevents non-repeatable reads, and **Serializable** prevents phantoms too, at the cost of throughput. A dirty read sees uncommitted data, a non-repeatable read sees a row change between two reads, and a phantom read sees new rows matching the same query.`,
      points: [
        "Read Committed + optimistic locking or SELECT FOR UPDATE is the common banking choice.",
        "Higher isolation means more locking or more serialization failures to retry.",
        "Exact behaviour differs by vendor; PostgreSQL's Repeatable Read is snapshot isolation."
      ],
      code: `@Transactional(isolation = Isolation.READ_COMMITTED)
public BigDecimal availableBalance(String acc) { ... }

SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;`,
      followups: [
        { q: "Which anomaly causes a lost update?", a: "Two transactions read the same value and both write back; Read Committed doesn't prevent it, so use row locks, @Version or atomic UPDATE ... SET balance = balance - x." },
        { q: "What is MVCC?", a: "Multi-version concurrency control: readers see a consistent snapshot from row versions instead of blocking on writers, used by Oracle, PostgreSQL and InnoDB." }
      ]
    },
    {
      id: "sql-indexes",
      title: "Indexes: B-tree, clustered vs non-clustered, composite",
      tag: "must",
      type: "concept",
      answer: `An index is typically a **B-tree** that turns a full table scan into an O(log n) lookup. A **clustered** index defines the physical order of rows (one per table, usually the primary key); a **non-clustered** index is a separate structure pointing to rows. A **composite** index follows the **leftmost prefix** rule: an index on \`(account_id, txn_date)\` helps queries filtering on \`account_id\` or both, not \`txn_date\` alone. Indexes speed reads but slow inserts and updates and take space, so I index based on real query patterns.`,
      points: [
        "Index often not used: function on column (UPPER(name)), leading wildcard LIKE '%abc', implicit type conversion, OR across columns, low selectivity.",
        "Covering index includes all selected columns, avoiding table lookups.",
        "Put the equality column first, then the range column, in composite indexes."
      ],
      code: `CREATE INDEX idx_txn_acc_date ON transactions(account_id, txn_date);

-- Uses index
SELECT * FROM transactions WHERE account_id = 101 AND txn_date >= DATE '2026-01-01';
-- Cannot use it efficiently (no leading column)
SELECT * FROM transactions WHERE txn_date >= DATE '2026-01-01';
-- Function kills the index unless a function-based index exists
SELECT * FROM customers WHERE UPPER(email) = 'A@B.COM';`,
      followups: [
        { q: "How many indexes is too many?", a: "When write latency suffers or indexes are unused. Check index usage stats and remove unused or duplicate ones." },
        { q: "Unique index vs unique constraint?", a: "A unique constraint is enforced through a unique index; the constraint expresses the business rule, e.g. one idempotency key per payment." }
      ]
    },
    {
      id: "sql-explain",
      title: "Query optimization and EXPLAIN plan",
      tag: "must",
      type: "scenario",
      answer: `For a slow query, I first get the actual plan with \`EXPLAIN ANALYZE\` (Postgres) or \`EXPLAIN PLAN\` (Oracle) and look for full table scans on large tables, bad join orders, wrong row estimates and sorts spilling to disk. Fixes include adding the right index, rewriting the query to be index-friendly, selecting only needed columns, updating statistics, and paginating. I validate with real data volumes, because a plan on 100 rows tells you nothing about 100 million.`,
      code: `EXPLAIN ANALYZE
SELECT t.txn_id, t.amount
FROM transactions t
WHERE t.account_id = 101
  AND t.txn_date >= now() - interval '30 days'
ORDER BY t.txn_date DESC
LIMIT 50;
-- Look for: Seq Scan vs Index Scan, rows estimated vs actual, Sort Method: external merge`,
      followups: [
        { q: "How do you find slow queries in production?", a: "Slow query log or pg_stat_statements / AWR reports, APM traces showing DB spans, and Hibernate statistics." },
        { q: "Why might the optimizer ignore your index?", a: "Stale statistics, low selectivity where a scan is cheaper, a type mismatch, or a function on the column." }
      ]
    },
    {
      id: "sql-joins",
      title: "Join types",
      tag: "must",
      type: "comparison",
      answer: `**INNER JOIN** returns only matching rows from both tables. **LEFT JOIN** returns all rows from the left table, with NULLs where there's no match, which is useful for "customers without accounts". **RIGHT JOIN** is the mirror image, **FULL OUTER JOIN** returns all rows from both, **CROSS JOIN** is a Cartesian product, and a **self join** joins a table to itself, like employee to manager.`,
      code: `-- Customers who have never transacted
SELECT c.customer_id, c.name
FROM customers c
LEFT JOIN transactions t ON t.customer_id = c.customer_id
WHERE t.txn_id IS NULL;

-- Employee with manager name (self join)
SELECT e.name AS employee, m.name AS manager
FROM employees e LEFT JOIN employees m ON e.manager_id = m.emp_id;`,

        { q: "Filter in ON vs WHERE for a LEFT JOIN?", a: "A condition on the right table in WHERE turns it into an inner join; put it in ON to keep unmatched left rows." },

    }
}`,

Card charged 1200

      followups: [
        { q: "Factory Method vs Abstract Factory?", a: "Factory Method lets subclasses decide which single product to create; Abstract Factory creates families of related objects, like UI widgets for one theme or clients for one bank partner." },
        { q: "How would you do this in Spring?", a: "Inject Map<String, PaymentProcessor> where keys are bean names; Spring fills it with all implementations." }

      id: "pat-builder",
      title: "Builder pattern",
      tag: "must",
      type: "program",
      answer: `Builder constructs complex objects step by step, which avoids telescoping constructors with many parameters and makes the call readable. It pairs well with immutability: the builder collects values, validates them in \`build()\`, and creates a fully initialized immutable object. Examples are \`StringBuilder\`, \`HttpRequest.newBuilder()\`, and Lombok's \`@Builder\`.`,
      code: `import java.math.BigDecimal;

final class PaymentRequest {
    private final String fromAccount;
    private final String toAccount;
    private final BigDecimal amount;
    private final String currency;
    private final String remarks;

    private PaymentRequest(Builder b) {
        this.fromAccount = b.fromAccount;
        this.toAccount = b.toAccount;
        this.amount = b.amount;
        this.currency = b.currency;
        this.remarks = b.remarks;
    }

    static Builder builder() { return new Builder(); }

    @Override public String toString() {
        return fromAccount + " -> " + toAccount + " : " + amount + " " + currency
                + (remarks == null ? "" : " (" + remarks + ")");
    }

    static class Builder {
        private String fromAccount, toAccount, remarks;
        private BigDecimal amount;
        private String currency = "INR";                     // sensible default

        Builder from(String acc) { this.fromAccount = acc; return this; }
        Builder to(String acc) { this.toAccount = acc; return this; }
        Builder amount(BigDecimal amt) { this.amount = amt; return this; }
        Builder currency(String c) { this.currency = c; return this; }
        Builder remarks(String r) { this.remarks = r; return this; }

        PaymentRequest build() {
            if (fromAccount == null || toAccount == null) throw new IllegalStateException("Accounts required");
            if (amount == null || amount.signum() <= 0) throw new IllegalStateException("Amount must be positive");
            return new PaymentRequest(this);
        }
    }
}

public class BuilderDemo {
    public static void main(String[] args) {
        PaymentRequest req = PaymentRequest.builder()
                .from("ACC-1001").to("ACC-2002")
                .amount(new BigDecimal("2500.00"))
                .remarks("Rent")
                .build();
        System.out.println(req);
        try {
            PaymentRequest.builder().from("ACC-1001").to("ACC-2002").amount(BigDecimal.ZERO).build();
        } catch (IllegalStateException e) {
            System.out.println("Rejected: " + e.getMessage());
        }
    }
}`,
      run: "java8",
      output: `ACC-1001 -> ACC-2002 : 2500.00 INR (Rent)
Rejected: Amount must be positive`,
      followups: [
        { q: "Builder vs constructor vs setters?", a: "Constructors get unreadable beyond 3-4 params; setters leave objects mutable and possibly half-initialized; Builder gives readability plus immutability and validation." },

      ]
    },
    {
      id: "pat-strategy",
      title: "Strategy pattern",
      tag: "must",
      type: "program",
      answer: `Strategy defines a family of interchangeable algorithms behind one interface and picks one at runtime. It replaces if-else chains on type and directly supports Open/Closed. A banking example is interest calculation that differs for savings, senior citizen and NRI accounts. Since Java 8, a strategy can simply be a lambda when it is small; \`Comparator\` is the JDK's best-known strategy.`,
      code: `import java.math.BigDecimal;
import java.math.RoundingMode;
import java.util.EnumMap;
import java.util.Map;

interface InterestStrategy { BigDecimal annualInterest(BigDecimal balance); }

enum AccountType { SAVINGS, SENIOR_CITIZEN, NRI }

class InterestCalculator {
    private final Map<AccountType, InterestStrategy> strategies = new EnumMap<>(AccountType.class);

    InterestCalculator() {
        strategies.put(AccountType.SAVINGS, b -> b.multiply(new BigDecimal("0.035")));
        strategies.put(AccountType.SENIOR_CITIZEN, b -> b.multiply(new BigDecimal("0.040")));
        strategies.put(AccountType.NRI, b -> b.multiply(new BigDecimal("0.030")));
    }

    BigDecimal calculate(AccountType type, BigDecimal balance) {
        return strategies.get(type).annualInterest(balance).setScale(2, RoundingMode.HALF_UP);
    }
}

public class StrategyDemo {
    public static void main(String[] args) {
        InterestCalculator calc = new InterestCalculator();
        BigDecimal balance = new BigDecimal("100000");
        for (AccountType t : AccountType.values()) {
            System.out.println(t + " -> " + calc.calculate(t, balance));
        }
    }
}`,
      run: "java8",
      output: `SAVINGS -> 3500.00
SENIOR_CITIZEN -> 4000.00
NRI -> 3000.00`,
      followups: [
        { q: "Strategy vs State?", a: "Both swap behaviour via composition; in Strategy the client chooses the algorithm, in State the object changes its own behaviour as its internal state changes (e.g. payment INITIATED -> AUTHORIZED -> SETTLED)." },
        { q: "Strategy vs Template Method?", a: "Strategy uses composition and swaps the whole algorithm; Template Method uses inheritance and fixes the skeleton while subclasses fill in steps." }
      ]
    },
    {
      id: "pat-observer",
      title: "Observer pattern",
      tag: "must",
      type: "program",
      answer: `Observer lets a subject notify multiple listeners when something happens, without knowing who they are. When a transaction completes, SMS, email, fraud monitoring and audit can all react, and adding a new listener doesn't touch the transaction code. In Spring this is \`ApplicationEventPublisher\` with \`@EventListener\` or \`@TransactionalEventListener\`; across services, it becomes Kafka pub-sub.`,
      code: `import java.util.ArrayList;
import java.util.List;

interface TransactionListener { void onTransaction(String txnId, double amount); }

class TransactionPublisher {
    private final List<TransactionListener> listeners = new ArrayList<>();
    void subscribe(TransactionListener l) { listeners.add(l); }
    void complete(String txnId, double amount) {
        System.out.println("Transaction " + txnId + " completed");
        for (TransactionListener l : listeners) l.onTransaction(txnId, amount);
    }
}

class SmsNotifier implements TransactionListener {
    public void onTransaction(String id, double amt) { System.out.println("SMS sent for " + id); }
}

class FraudMonitor implements TransactionListener {
    public void onTransaction(String id, double amt) {
        if (amt > 100000) System.out.println("Fraud check flagged " + id);
    }
}

public class ObserverDemo {
    public static void main(String[] args) {
        TransactionPublisher publisher = new TransactionPublisher();
        publisher.subscribe(new SmsNotifier());
        publisher.subscribe(new FraudMonitor());
        publisher.subscribe((id, amt) -> System.out.println("Audit logged " + id));  // lambda listener

        publisher.complete("T1", 5000);
        publisher.complete("T2", 250000);
    }
}`,

SMS sent for T1
Audit logged T1
Transaction T2 completed
SMS sent for T2
Fraud check flagged T2
Audit logged T2`,

        { q: "What's @TransactionalEventListener for?", a: "It runs the listener only after the publishing transaction commits (AFTER_COMMIT by default), so we never send an SMS for a payment that rolled back." },

      ]
    },
    {
      id: "pat-decorator",
      title: "Decorator pattern",
      tag: "must",
      type: "program",
      answer: `Decorator adds behaviour to an object at runtime by wrapping it in another object with the same interface, instead of subclassing. Wrappers can be stacked in any combination, like adding GST and then a convenience fee on top of a base fee. The JDK's I/O streams are the classic example: \`new BufferedReader(new InputStreamReader(in))\`. Spring uses the same idea with proxies.`,
      code: `import java.math.BigDecimal;
import java.math.RoundingMode;

interface Fee { BigDecimal amount(); String describe(); }

class BaseFee implements Fee {
    private final BigDecimal value;
    BaseFee(BigDecimal value) { this.value = value; }
    public BigDecimal amount() { return value; }
    public String describe() { return "Base fee"; }
}

abstract class FeeDecorator implements Fee {
    protected final Fee inner;
    FeeDecorator(Fee inner) { this.inner = inner; }
}

class GstDecorator extends FeeDecorator {
    GstDecorator(Fee inner) { super(inner); }
    public BigDecimal amount() { return inner.amount().multiply(new BigDecimal("1.18")); }
    public String describe() { return inner.describe() + " + GST 18%"; }
}

class ConvenienceFeeDecorator extends FeeDecorator {
    ConvenienceFeeDecorator(Fee inner) { super(inner); }
    public BigDecimal amount() { return inner.amount().add(new BigDecimal("10")); }
    public String describe() { return inner.describe() + " + convenience 10"; }
}

public class DecoratorDemo {
    public static void main(String[] args) {
        Fee fee = new ConvenienceFeeDecorator(new GstDecorator(new BaseFee(new BigDecimal("100"))));
        System.out.println(fee.describe());
        System.out.println("Total: " + fee.amount().setScale(2, RoundingMode.HALF_UP));
    }
}`,
      run: "java8",
      output: `Base fee + GST 18% + convenience 10
Total: 128.00`,
      followups: [
        { q: "Decorator vs inheritance?", a: "Inheritance fixes combinations at compile time and causes class explosion; decorators combine behaviours at runtime." },
        { q: "Decorator vs Proxy?", a: "Same structure; Decorator adds features, Proxy controls access (lazy loading, security, transactions, remote calls)." }
      ]
    },

      id: "pat-adapter",
      title: "Adapter pattern",
      tag: "good",
      type: "concept",
      answer: `Adapter converts one interface into another that the client expects, so incompatible classes can work together. It's very common in banking integrations: our code depends on a \`CreditBureauClient\` interface, and an adapter wraps the vendor's SDK or legacy SOAP API and maps their request and response models to ours. If we change vendors, we write a new adapter and the business code stays untouched. JDK examples are \`Arrays.asList()\` and \`InputStreamReader\`.`,
      code: `public interface CreditBureauClient { int creditScore(String pan); }

// Vendor SDK we can't change
class VendorBureauSdk { VendorReport fetchReport(String panNumber, String product) { ... } }

class VendorBureauAdapter implements CreditBureauClient {
    private final VendorBureauSdk sdk;
    VendorBureauAdapter(VendorBureauSdk sdk) { this.sdk = sdk; }

        return sdk.fetchReport(pan, "RETAIL").getScoreValue();   // translate vendor model
    }
}`,

        { q: "Adapter vs Facade?", a: "Adapter makes one existing interface match another; Facade provides a new, simpler interface over a whole subsystem." },

      id: "pat-proxy",
      title: "Proxy pattern & Spring AOP",
      tag: "must",
      type: "concept",
      answer: `A Proxy stands in front of a real object with the same interface and controls access to it, adding things like lazy loading, security checks, caching or transactions. Spring AOP is built on proxies: \`@Transactional\`, \`@Cacheable\`, \`@Async\` and \`@PreAuthorize\` work because Spring injects a proxy that runs extra logic before and after calling the bean. It uses JDK dynamic proxies for interfaces and CGLIB subclasses otherwise; Hibernate lazy loading also uses proxies.`,
      code: `@Aspect
@Component
public class AuditAspect {
    @Around("@annotation(Audited)")
    public Object audit(ProceedingJoinPoint pjp) throws Throwable {
        long start = System.nanoTime();
        try {
            return pjp.proceed();                      // call the real method
        } finally {
            log.info("{} took {} ms", pjp.getSignature().getName(), (System.nanoTime() - start) / 1_000_000);
        }
    }
}`,
      points: [
        "Self-invocation (this.method()) bypasses the proxy, so @Transactional/@Cacheable on it won't apply.",
        "Proxies only intercept public methods by default; final classes/methods can't be CGLIB-proxied."

      followups: [
        { q: "Why doesn't @Transactional work on a private method?", a: "The proxy intercepts calls from outside the bean; private methods aren't overridable or callable through the proxy, so no advice runs." },
        { q: "JDK proxy vs CGLIB?", a: "JDK proxies implement interfaces only; CGLIB creates a subclass at runtime, so it works on classes but not on final ones. Spring Boot defaults to CGLIB." }

    {
      id: "pat-template",
      title: "Template Method pattern",
      tag: "good",
      type: "concept",
      answer: `Template Method defines the fixed skeleton of an algorithm in a base class and lets subclasses fill in specific steps. For example, every statement export follows fetch, format, sign and deliver, but the format differs for PDF and CSV. Spring's \`JdbcTemplate\`, \`RestTemplate\` and \`KafkaTemplate\` apply the same idea through callbacks: the template handles connections, exceptions and cleanup, and I supply only the query and the row mapping.`,
      code: `abstract class StatementExporter {
    public final void export(String accountId) {          // final skeleton
        List<Txn> txns = fetch(accountId);
        byte[] file = format(txns);                         // varying step
        deliver(accountId, sign(file));
    }
    protected abstract byte[] format(List<Txn> txns);
    // fetch, sign, deliver implemented here once
}

// JdbcTemplate: template handles connection & exceptions, I give the varying parts
List<Account> list = jdbcTemplate.query(
    "SELECT id, balance FROM account WHERE branch = ?",
    (rs, i) -> new Account(rs.getString("id"), rs.getBigDecimal("balance")), branch);`,
      followups: [
        { q: "Why make the template method final?", a: "So subclasses can't change the order of steps, only the steps meant to vary." },

      id: "pat-chain",
      title: "Chain of Responsibility",
      tag: "good",
      type: "concept",
      answer: `Chain of Responsibility passes a request along a chain of handlers; each one handles it, rejects it or passes it to the next. Servlet filters and the Spring Security filter chain are exactly this: CORS, authentication, authorization and logging filters each do their part. I also use it for payment validation: KYC check, limit check, beneficiary check and fraud check as separate, ordered handlers that are easy to add or reorder.`,
      code: `interface PaymentCheck { void check(Payment p); }      // throws on failure

@Component @Order(1) class KycCheck   implements PaymentCheck { ... }
@Component @Order(2) class LimitCheck implements PaymentCheck { ... }
@Component @Order(3) class FraudCheck implements PaymentCheck { ... }

@Service
class PaymentValidator {
    private final List<PaymentCheck> checks;           // Spring injects in @Order order
    PaymentValidator(List<PaymentCheck> checks) { this.checks = checks; }

}`,

      title: "Facade pattern",
      tag: "good",
      type: "concept",
      answer: `Facade gives a simple, unified interface over a complex subsystem. Account opening, for example, involves KYC, credit check, account creation, card issuance and a welcome notification; an \`AccountOpeningFacade\` exposes one \`openAccount()\` method that coordinates them. Controllers and other callers stay simple and aren't coupled to every subsystem. \`SLF4J\` is also a facade over logging frameworks.`,
      code: `@Service
public class AccountOpeningFacade {

    private final CardService cards; private final NotificationService notify;

        { q: "Risk of a facade?", a: "It can grow into a god class; keep it a thin coordinator without business rules of its own." },

      id: "pat-composition",
      title: "Composition over inheritance",
      tag: "must",
      type: "concept",
      answer: `Inheritance models an "is-a" relationship but couples the subclass tightly to the parent's implementation; a change in the parent can break every child, and Java allows only one superclass. Composition models "has-a": a class holds references to collaborators behind interfaces and delegates to them, so behaviour can be swapped at runtime and tested in isolation. I use inheritance only for true, stable is-a hierarchies, and composition plus interfaces everywhere else.`,
      code: `// Inheritance: rigid
class LoggingPaymentService extends PaymentService { ... }

// Composition: flexible, testable
class PaymentService {
    private final FeeCalculator fees;      // has-a
    private final Notifier notifier;       // has-a, swappable
    PaymentService(FeeCalculator fees, Notifier notifier) { this.fees = fees; this.notifier = notifier; }
}`,
      followups: [
        { q: "What's the fragile base class problem?", a: "Subclasses depend on the parent's internal behaviour, so a seemingly safe change in the parent breaks them. Effective Java's InstrumentedHashSet addAll example is the classic case." },
        { q: "When is inheritance the right choice?", a: "For genuine is-a relationships with a stable base, like abstract templates, or framework extension points designed for it." }
      ]
    },
    {
      id: "pat-clean-code",
      title: "Clean code: DRY, KISS, YAGNI",
      tag: "must",
      type: "concept",
      answer: `**DRY** means each piece of knowledge has one place, so a business rule like a daily limit isn't duplicated in three services. **KISS** means prefer the simplest design that works. **YAGNI** means don't build features or abstractions until they're actually needed. Beyond those, clean code for me means meaningful names, small methods doing one thing, no magic numbers, proper exception handling instead of swallowing errors, and tests that document behaviour.`,
      points: [
        "Names reveal intent: `isEligibleForOverdraft()` beats `check2()`.",
        "Fail fast with clear exceptions; never empty catch blocks.",
        "Use BigDecimal for money, Optional for absent results, immutability by default.",
        "Over-applying DRY can couple unrelated code; duplication is cheaper than the wrong abstraction."

      followups: [
        { q: "How do you enforce clean code in a team?", a: "Agreed coding standards, automated formatting and static analysis (Sonar, Checkstyle) in CI, and code reviews focused on design and readability." },
        { q: "What's a code smell?", a: "A surface sign of a deeper design problem: long methods, large classes, long parameter lists, duplicated code, feature envy, primitive obsession." }
      ]
    },
    {
      id: "pat-review-checklist",
      title: "Code review checklist (as a lead)",
      tag: "must",
      type: "behavioral",
      answer: `When I review code, I go beyond style, which tools should handle. I check correctness against the requirement including edge cases; design and readability, such as responsibilities and naming; error handling and logging without leaking sensitive data; concurrency and transaction boundaries; performance like N+1 queries, unbounded queries, and missing indexes or timeouts; security like input validation, authorization and secrets; and tests that cover the important paths. I keep feedback specific and respectful, separate must-fix from suggestions, and keep PRs small so reviews stay fast.`,

        "Correctness and edge cases (nulls, empty lists, money rounding, time zones).",
        "Transactions, idempotency and concurrency for financial operations.",
        "Performance: N+1, pagination, indexes, timeouts on remote calls.",
        "Security: validation, authZ checks, no PII/card data in logs, no hard-coded secrets.",
        "Tests and observability: meaningful tests, logs with correlation id, metrics."

        { q: "How do you handle a developer who disagrees with review comments?", a: "Discuss the reasoning, refer to agreed standards or data, and if it's a preference rather than a defect, let it go; escalate only genuine risks." },
        { q: "What should be automated rather than reviewed?", a: "Formatting, lint rules, test coverage thresholds, dependency vulnerability scans and static analysis, all as CI quality gates." }
      ]
    },
    {
      id: "pat-anti-patterns",
      title: "Common anti-patterns",
      tag: "good",
      type: "concept",
      answer: `Anti-patterns are common solutions that look reasonable but cause problems. The ones I see most are the **god class** that knows and does too much; the **anemic domain model**, where entities are just getters and setters and all logic lives in huge services; **magic numbers and strings**; **copy-paste programming**; **swallowing exceptions**; and in microservices, the **distributed monolith** and a **shared database** across services. I address them through refactoring in small steps, backed by tests.`,

        "God class: split by responsibility (SRP).",
        "Anemic model: move behaviour like `account.debit()` with its invariants into the entity.",
        "Swallowed exceptions hide production failures; log with context or rethrow.",
        "Premature optimization and over-engineering are anti-patterns too."

        { q: "How do you refactor a god class safely?", a: "Add characterization tests first, then extract cohesive pieces step by step, keeping behaviour identical and merging small PRs." }
      ]
    }
  ]
