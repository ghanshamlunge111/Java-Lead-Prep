      points: [
        "Never use `Thread.sleep` in tests; use Awaitility or latches.",
        "Test the retry and dead-letter path: a poison message should land on the DLT after N attempts.",
        "For pure logic, call the listener method directly in a unit test, without Kafka."
      ],
      followups: [
        { q: "@EmbeddedKafka vs Testcontainers Kafka?", a: "`@EmbeddedKafka` (spring-kafka-test) runs an in-memory broker, which is quick and needs no Docker. Testcontainers runs the real Kafka image, which is closer to production. Many teams use embedded for quick tests and Testcontainers for full integration tests." },
        { q: "How do you test @Async methods?", a: "Return a `CompletableFuture` and join on it with a timeout, or assert the side effect with Awaitility. In unit tests, you can also call the method synchronously by testing the class without the Spring proxy." }
      ]
    },
    {
      id: "tst-contract",
      title: "Contract testing (Spring Cloud Contract / Pact)",
      tag: "good",
      type: "concept",
      answer: `In microservices, a provider can break consumers by renaming a JSON field, and unit tests on either side won't notice. **Contract testing** captures the agreed request and response as a contract. The provider's build verifies that it still honours every contract, and consumers test against stubs generated from the same contract. **Pact** is consumer-driven, where consumers publish their expectations to a Pact Broker. **Spring Cloud Contract** is provider-oriented in the Spring ecosystem and generates both provider tests and WireMock stubs. It catches breaking API changes at build time instead of in UAT.`,
      points: [
        "Cheaper and more reliable than full end-to-end environments for checking API compatibility.",
        "Pact's `can-i-deploy` check blocks a release that would break a consumer.",
        "Complements, not replaces, API versioning and backward-compatible changes."
      ],
      followups: [
        { q: "Contract test vs integration test?", a: "An integration test checks that my service works with real infrastructure. A contract test checks that two services agree on the API shape, without both running together." },
        { q: "What is WireMock used for?", a: "Stubbing external HTTP services in tests, such as a payment gateway or credit bureau API, including slow responses and error codes to test timeouts and retries." }
      ]
    },
    {
      id: "tst-coverage",
      title: "Code coverage with JaCoCo",
      tag: "must",
      type: "concept",
      answer: `**JaCoCo** instruments the bytecode during test runs and reports line and branch coverage. I wire it into Maven so the report is generated in \`verify\` and uploaded to SonarQube. I treat coverage as a **floor, not a goal**. A gate like 80% on **new code** stops untested changes from coming in, but 100% coverage with weak assertions proves nothing. As a lead, I review whether the tests assert meaningful behaviour, especially branches like limit breaches and error paths, rather than chasing the percentage. Mutation testing with PIT is a good way to measure test strength.`,
      code: `<plugin>
  <groupId>org.jacoco</groupId>
  <artifactId>jacoco-maven-plugin</artifactId>
  <version>0.8.12</version>
  <executions>
    <execution><goals><goal>prepare-agent</goal></goals></execution>
    <execution>
      <id>report</id><phase>verify</phase>
      <goals><goal>report</goal></goals>
    </execution>
  </executions>
</plugin>`,
      points: [
        "Branch coverage is more meaningful than line coverage for business rules.",
        "Exclude generated code, DTOs and config classes so the number reflects real logic.",
        "Gate on new-code coverage in Sonar; legacy code improves incrementally."
      ],
      followups: [
        { q: "What is mutation testing?", a: "A tool like PIT makes small changes to the code, such as flipping `>` to `>=`, and checks whether any test fails. Surviving mutants reveal tests that execute code without really asserting its behaviour." },
        { q: "The team has 40% coverage on legacy code. What do you do?", a: "Don't block delivery with a big target. Enforce a gate on new and changed code, add tests whenever a bug is fixed or code is touched, and prioritise tests for high-risk money-handling paths first." }
      ]
    },
    {
      id: "tst-tdd",
      title: "TDD in practice",
      tag: "good",
      type: "concept",
      answer: `**Test-Driven Development** follows the **Red, Green, Refactor** cycle. First write a failing test for the next small behaviour, then write the minimum code to pass it, then clean up the design while the tests stay green. The benefit is that the design comes out testable and loosely coupled, and every requirement has an executable specification. In practice I use TDD most for complex business rules like fee slabs, interest calculation and limit validation, and for **bug fixes**, where I first write a test that reproduces the bug. For thin glue code, I'm pragmatic.`,
      points: [
        "Start with the simplest case, then add edge cases one test at a time.",
        "Refactor only on green.",
        "BDD-style naming (given/when/then) makes tests read like requirements for BAs and reviewers."
      ],
      followups: [
        { q: "Does TDD slow the team down?", a: "It's slower up front, but it reduces debugging, regressions and rework. For complex financial logic, it usually pays back quickly. The key is to apply it where the logic is complex." },
        { q: "How do you introduce TDD to a team?", a: "Pair programming on a real story, start with bug-fix tests, share good examples in code review, and don't mandate it rigidly for trivial code." }
      ]
    },
    {
      id: "tst-maven",
      title: "Maven lifecycle, scopes and dependency conflicts",
      tag: "must",
      type: "concept",
      answer: `Maven's default lifecycle runs in order: **validate, compile, test, package, verify, install, deploy**. Running a phase runs everything before it, so \`mvn install\` also compiles and tests. The dependency **scopes** are \`compile\`, the default and available everywhere; \`provided\`, supplied by the runtime, like the servlet API on an external Tomcat; \`runtime\`, like a JDBC driver; and \`test\`, like JUnit and Mockito. Conflicts happen because of transitive dependencies. Maven picks the **nearest** version in the tree, which can silently choose an old version and cause \`NoSuchMethodError\` at runtime. I diagnose with \`mvn dependency:tree\`, then fix with an \`<exclusion>\` or by pinning the version in \`<dependencyManagement>\`. Spring Boot's parent or BOM already manages consistent versions for most libraries.`,
      code: `mvn dependency:tree -Dincludes=com.fasterxml.jackson.core   # who brings which version
mvn -B clean verify                                          # CI build

<dependency>
  <groupId>com.vendor</groupId>
  <artifactId>payment-sdk</artifactId>
  <version>2.1.0</version>
  <exclusions>
    <exclusion>
      <groupId>com.fasterxml.jackson.core</groupId>
      <artifactId>jackson-databind</artifactId>
    </exclusion>
  </exclusions>
</dependency>

<dependencyManagement>
  <dependencies>
    <dependency>
      <groupId>org.springframework.cloud</groupId>
      <artifactId>spring-cloud-dependencies</artifactId>
      <version>\${spring-cloud.version}</version>
      <type>pom</type><scope>import</scope>
    </dependency>
  </dependencies>
</dependencyManagement>`,
      points: [
        "`dependencyManagement` declares versions only; `dependencies` actually adds the jar.",
        "Surefire runs unit tests in `test`; Failsafe runs `*IT` integration tests in `verify`.",
        "`mvn -U` forces a refresh of snapshot dependencies; `-o` builds offline.",
        "Use the Maven Enforcer plugin to ban duplicate classes and enforce convergence."
      ],
      followups: [
        { q: "You get NoSuchMethodError in production but it compiles fine. Why?", a: "Classic version conflict. Code was compiled against one version of a library, but a different transitive version won on the runtime classpath. Check `mvn dependency:tree` and align the version with dependencyManagement or an exclusion." },
        { q: "What's the difference between install and deploy?", a: "`install` puts the artifact in the local `~/.m2` repository for other local builds. `deploy` uploads it to a remote repository like Nexus or Artifactory for the team and CI." }
      ]
    },
    {
      id: "tst-maven-gradle",
      title: "Maven vs Gradle",
      tag: "good",
      type: "comparison",
      answer: `**Maven** uses declarative XML with a fixed lifecycle and strong conventions, so every Maven project looks the same. That's predictable and is still the most common choice in enterprise banking codebases. **Gradle** uses a Groovy or Kotlin DSL that's more flexible and concise. It's faster thanks to incremental builds, a build cache and a daemon, which matters for large multi-module projects. I'd choose Maven for standardisation and team familiarity, and Gradle when build performance or custom build logic really matters.`,
      points: [
        "Both use the same Maven Central repositories and coordinates.",
        "Gradle flexibility can turn builds into hard-to-maintain scripts without discipline.",
        "Spring Boot supports both equally (`spring-boot-maven-plugin` / `org.springframework.boot` plugin)."
      ],
      followups: [
        { q: "What's the Maven wrapper (mvnw)?", a: "A script committed to the repo that downloads a pinned Maven version, so every developer and the CI server build with exactly the same Maven." },
        { q: "How do you speed up a slow Maven build?", a: "Build in parallel with `-T 1C`, cache `~/.m2` in CI, build only changed modules with `-pl` and `-am`, and move slow integration tests to a separate stage." }
      ]
    },
    {
      id: "tst-logging",
      title: "Logging with SLF4J, Logback and MDC",
      tag: "must",
      type: "concept",
      answer: `**SLF4J** is the logging facade the code depends on, and **Logback** is the default implementation in Spring Boot. I use **parameterised messages**, like \`log.info("Payment {} processed", id)\`, so strings aren't built when the level is disabled. Levels are: ERROR for failures that need action, WARN for recoverable issues, INFO for key business events, and DEBUG or TRACE for diagnostics, which are off in production. **MDC** (Mapped Diagnostic Context) attaches a correlation ID to every log line on that thread, so I can trace one payment across all its logs. In banking, logs must **never** contain card numbers, CVV, passwords, OTPs, full account numbers or tokens, so I mask them centrally.`,
      code: `@Component
public class CorrelationIdFilter extends OncePerRequestFilter {
    @Override
    protected void doFilterInternal(HttpServletRequest req, HttpServletResponse res, FilterChain chain)
            throws ServletException, IOException {
        String id = Optional.ofNullable(req.getHeader("X-Correlation-Id"))
                            .orElse(UUID.randomUUID().toString());
        MDC.put("correlationId", id);
        res.setHeader("X-Correlation-Id", id);
        try {
            chain.doFilter(req, res);
        } finally {
            MDC.clear();            // thread is reused by the pool
        }
    }
}

// logback pattern: %d %-5level [%X{correlationId}] %logger{36} - %msg%n
log.info("Transfer completed txnId={} amount={} from={}", txnId, amount, mask(accountNo));
log.error("Gateway call failed txnId={}", txnId, ex);   // exception as last arg keeps stack trace`,
      points: [
        "Always `MDC.clear()` in finally; pooled threads otherwise leak IDs into other requests.",
        "MDC doesn't automatically cross thread pools or `@Async`; use a TaskDecorator or context propagation.",
        "Structured JSON logs (logstash encoder or Boot 3.4 structured logging) are easier to search in ELK.",
        "Change log levels at runtime via `/actuator/loggers` without a restart."
      ],
      followups: [
        { q: "Why not use string concatenation in log statements?", a: "`\"x=\" + obj` always builds the string, even when DEBUG is off, wasting CPU on hot paths. Placeholders defer formatting until the level is enabled." },
        { q: "How do you ensure PII never reaches logs?", a: "Log IDs instead of personal data, use masking helpers or a Logback masking pattern converter, review logs in code review, and run automated scans on log samples. Also restrict who can read production logs." }
      ]
    },
    {
      id: "tst-sonar",
      title: "SonarQube quality gates and static analysis",
      tag: "must",
      type: "concept",
      answer: `**SonarQube** analyses code on every build for **bugs**, **vulnerabilities**, **security hotspots** that need human review (like a hard-coded credential or weak crypto), **code smells** such as complexity, duplication or dead code, and **coverage**. A **quality gate** is a pass or fail rule set, typically on new code: zero new bugs and vulnerabilities, hotspots reviewed, at least 80% coverage, and under 3% duplication. The CI pipeline blocks the merge if the gate fails. As a lead, it gives the team an objective, automated standard, so code reviews can focus on design and logic instead of style.`,
      points: [
        "Focus gates on new code (\"clean as you code\"), so legacy debt doesn't block delivery.",
        "Complement with SpotBugs, Checkstyle and dependency scanners (OWASP Dependency-Check, Snyk).",
        "Mark false positives deliberately with justification, never blanket-suppress rules.",
        "SonarLint in the IDE catches issues before commit."
      ],
      followups: [
        { q: "What's a security hotspot vs a vulnerability?", a: "A vulnerability is code Sonar is confident is exploitable. A hotspot is security-sensitive code, like a regex, cookie settings or SQL building, that a developer must review to decide whether it's safe." },
        { q: "How do you handle a large backlog of Sonar issues?", a: "Gate on new code only, fix blockers and vulnerabilities first, fix smells when touching the file, and budget some tech-debt work every sprint." }
      ]
    },
    {
      id: "tst-performance",
      title: "Performance and load testing basics",
      tag: "good",
      type: "concept",
      answer: `Load testing checks whether the system meets its non-functional requirements, like 500 transactions per second with p99 latency under 300 ms, before production finds out. **Load tests** run at expected peak, **stress tests** push beyond it to find the breaking point, **soak tests** run for hours to expose memory leaks and connection leaks, and **spike tests** check sudden bursts like salary day. **JMeter** is GUI-driven and widely used. **Gatling** and **k6** are code-based and fit well in CI. I run against a production-like environment, watch Grafana while the test runs (CPU, GC, DB pool, slow queries), and compare against a baseline for every release.`,
      points: [
        "Measure percentiles (p95/p99), not averages.",
        "Use realistic data volumes and think time; testing against an empty DB lies.",
        "Find the bottleneck first (often DB, pool size or downstream), then tune.",
        "Keep a regression baseline so performance drops are caught per release."
      ],
      followups: [
        { q: "Throughput plateaus while CPU is low. What do you suspect?", a: "Something is waiting: an exhausted DB connection pool, a thread pool limit, lock contention, or a slow downstream call. Thread dumps and Hikari metrics usually show it." },
        { q: "What is Little's Law and why is it useful?", a: "Concurrency equals throughput times latency. For example, 200 requests per second at 0.25 seconds each means about 50 concurrent requests. That helps size thread pools and connection pools." }
      ]
    }
  ]
});

  /* ---------- helpers ---------- */
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function md(s) {

      var h = esc(p).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");

  }
  var JK = "abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var record sealed permits yield non-sealed true false null";
  var JKS = {}; JK.split(" ").forEach(function (k) { JKS[k] = 1; });
  var SK = "select from where and or not in is null as join inner left right full outer on group by order having limit offset insert into values update set delete create table index unique primary key foreign references alter drop truncate distinct count sum avg min max case when then else end with union all exists between like begin commit rollback for explain analyze desc asc row_number rank dense_rank over partition transaction isolation level read committed serializable repeatable lock share nowait skip locked default constraint view procedure returns cascade varchar int bigint decimal numeric timestamp date fetch first rows only next using";
  var SKS = {}; SK.split(" ").forEach(function (k) { SKS[k] = 1; });
  function hl(code) {
    var isSql = /^\s*(--|select|with|create|update|delete|insert|alter|explain|begin|start|drop|truncate)\b/i.test(code) && !/[{};]\s*\n\s*}/.test(code);
    var re = isSql
      ? /(--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:''|[^'])*')|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]+)\b/g

    var out = "", last = 0, m;
    while ((m = re.exec(code))) {
      out += esc(code.slice(last, m.index));
      var tok = m[0], cls = "";
      if (m[1]) cls = "hc";
      else if (m[2]) cls = "hs";
      else if (isSql) {
        if (m[3]) cls = "hn"; else if (SKS[tok.toLowerCase()]) cls = "hk";

            var parts = tok.split("-"); out += parts.map(function (p) { return JKS[p] ? '<span class="hk">' + esc(p) + "</span>" : (/^[A-Z]/.test(p) ? '<span class="ht">' + esc(p) + "</span>" : esc(p)); }).join("-");
            last = re.lastIndex; continue;
          }
          if (JKS[tok]) cls = "hk"; else if (/^[A-Z]/.test(tok)) cls = "ht";
        }
      }

      last = re.lastIndex;
    }
    return out + esc(code.slice(last));
  }
  function modStats(m) {

      '<div class="datebox"><label for="start">Plan start date</label><input type="date" id="start" value="' + (S.start || "") + '">' +

      '</div><div class="panel"><div class="stats">' +

    h += '<div class="weeks">';
    WEEKS.forEach(function (w) {
      h += '<article class="week' + (cw === w.n ? " now" : "") + '"><header><h2>Week ' + w.n + '</h2>' + (cw === w.n ? '<span class="pill">Current</span>' : "") + '</header>' +
        '<p class="focus">' + esc(w.title) + '</p>';
      w.mods.forEach(function (id) {
        var m = BY_ID[id]; if (!m) return; var st = modStats(m);
        h += '<button class="mod" data-open="' + m.id + '"><span class="row"><span class="nm">' + m.num + '. ' + esc(m.title) + '</span><span class="ct">' + st.done + '/' + st.total + '</span></span>' +
          '<span class="bar' + (st.done === st.total ? " done" : "") + '"><i style="width:' + st.pct + '%"></i></span></button>';
      });
      h += '<ul class="daily">' + w.daily.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + '</ul></article>';
    });
    h += '</div>';
    document.getElementById("view-plan").innerHTML = h;
  }

  /* ---------- study ---------- */
  var openSet = {};
  function topicHtml(t, showMod) {
    var cls = "topic" + (S.done[t.id] ? " is-done" : (S.rev[t.id] ? " is-rev" : ""));
    var open = !!openSet[t.id];
    var h = '<article class="' + cls + '" id="t-' + t.id + '" data-tid="' + t.id + '">' +
      '<button class="thead" data-toggle="' + t.id + '" aria-expanded="' + open + '">' +
      '<span class="check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>' +
      '<span class="tt">' + esc(t.title) + (showMod ? ' <span class="muted" style="font-weight:400;font-size:13px">· ' + esc(TOPIC_MOD[t.id].title) + '</span>' : "") + '</span>' +
      '<span class="meta">' + (t.tag === "must" ? '<span class="tag must">Must</span>' : "") + (S.rev[t.id] ? '<span class="tag rev">Revise</span>' : "") + confTag(t) +
      '<span class="tag">' + (TYPE_LABEL[t.type] || t.type) + '</span></span></button>';
    if (open) h += '<div class="tbody">' + bodyHtml(t, true) + '</div>';
    return h + '</article>';
  }
  function bodyHtml(t, withActions) {
    var h = '<div><div class="label">Interview answer</div><p class="answer">' + md(t.answer) + '</p></div>';
    if (t.points && t.points.length) h += '<div><div class="label">Key points</div><ul class="points">' + t.points.map(function (p) { return "<li>" + md(p) + "</li>"; }).join("") + '</ul></div>';
    if (t.code) h += '<div><div class="label">' + (t.run ? "Program · runs on Java " + (t.run === "java17" ? "17" : "8+") : "Example") + '</div><div class="codebox"><pre><code>' + hl(t.code) + '</code></pre><button class="copy" data-copy="' + t.id + '">Copy</button></div></div>';
    if (t.output) h += '<div class="out"><div class="label">Expected output</div><div class="codebox"><pre><code>' + esc(t.output) + '</code></pre></div></div>';
    if (t.followups && t.followups.length) h += '<div class="fu"><div class="label">Likely follow-ups</div>' + t.followups.map(function (f) { return '<details><summary>' + md(f.q) + '</summary><p>' + md(f.a) + '</p></details>'; }).join("") + '</div>';
    if (withActions) {
      var c = S.conf[t.id] || 0;
      h += '<div class="actions">' +
        '<button class="btn' + (S.done[t.id] ? " on-done" : "") + '" data-act="done" data-id="' + t.id + '">' + (S.done[t.id] ? "✓ Done" : "Mark done") + '</button>' +
        '<button class="btn' + (S.rev[t.id] ? " on-rev" : "") + '" data-act="rev" data-id="' + t.id + '">' + (S.rev[t.id] ? "Flagged for revision" : "Flag for revision") + '</button>' +
        '<span class="seg" role="group" aria-label="Confidence">' +
        [[1, "Shaky"], [2, "OK"], [3, "Confident"]].map(function (x) { return '<button data-act="conf" data-id="' + t.id + '" data-c="' + x[0] + '" aria-pressed="' + (c === x[0]) + '">' + x[1] + '</button>'; }).join("") +
        '</span></div>' +
        '<div><label class="label" for="note-' + t.id + '">My notes · my project example</label><textarea class="note" id="note-' + t.id + '" data-note="' + t.id + '" placeholder="Where did I use this? Add your own project example to speak about.">' + esc(S.notes[t.id] || "") + '</textarea></div>';
    }
    return h;
  }
  function filterTopics(list) {
    return list.filter(function (t) {
      if (UI.filter === "must") return t.tag === "must";
      if (UI.filter === "todo") return !S.done[t.id];
      if (UI.filter === "rev") return S.rev[t.id] || S.conf[t.id] === 1;
      if (UI.filter === "prog") return !!t.code;
      return true;
    });
  }
  function renderStudy() {
    var q = document.getElementById("q").value.trim().toLowerCase();
    var rail = '<nav class="rail" aria-label="Modules">';
    var sel = '<select class="railsel" id="railsel" aria-label="Module">';
    MODS.forEach(function (m) {
      var st = modStats(m);
      rail += '<button data-mod="' + m.id + '" aria-current="' + (!q && UI.mod === m.id) + '"><span class="n">' + String(m.num).padStart(2, "0") + '</span><span>' + esc(m.title) + '</span><span class="pc' + (st.done === st.total ? " full" : "") + '">' + st.done + '/' + st.total + '</span></button>';
      sel += '<option value="' + m.id + '"' + (UI.mod === m.id ? " selected" : "") + '>' + m.num + '. ' + esc(m.title) + ' (' + st.done + '/' + st.total + ')</option>';
    });
    rail += '</nav>'; sel += '</select>';
    var head, list, showMod = false;
    if (q) {
      list = ALL.filter(function (t) {
        return (t.title + " " + t.answer + " " + (t.points || []).join(" ") + " " + (t.followups || []).map(function (f) { return f.q; }).join(" ")).toLowerCase().indexOf(q) > -1;
      });
      list.sort(function (a, b) { return (b.title.toLowerCase().indexOf(q) > -1) - (a.title.toLowerCase().indexOf(q) > -1); });
      showMod = true;
      head = '<div class="modhead"><div class="eyebrow">Search</div><h1>' + list.length + ' topic' + (list.length === 1 ? "" : "s") + ' for “' + esc(q) + '”</h1></div>';
    } else {
      var m = BY_ID[UI.mod], st = modStats(m);
      list = m.topics;
      head = '<div class="modhead"><div class="eyebrow">Module ' + m.num + ' of ' + MODS.length + ' · ' + st.done + '/' + st.total + ' done · ' + st.mustD + '/' + st.must + ' must-know</div><h1>' + esc(m.title) + '</h1><p>' + esc(m.blurb) + '</p><div class="bar done"><i style="width:' + st.pct + '%"></i></div></div>';
    }
    var filters = [["all", "All"], ["must", "Must-know"], ["todo", "Not done"], ["rev", "Revise / Shaky"], ["prog", "With code"]];
    var fh = '<div class="filters">' + filters.map(function (f) { return '<button class="chip" data-filter="' + f[0] + '" aria-pressed="' + (UI.filter === f[0]) + '">' + f[1] + '</button>'; }).join("") + '</div>';
    var shown = filterTopics(list);
    var body = shown.length ? '<div class="topics">' + shown.map(function (t) { return topicHtml(t, showMod); }).join("") + '</div>'
      : '<div class="empty">' + (q ? "No topics match. Try a shorter word like “lock” or “stream”." : "Nothing here for this filter. Switch to All to see every topic.") + '</div>';
    var nav = "";
    if (!q) {
      var i = MODS.indexOf(BY_ID[UI.mod]);
      nav = '<div style="display:flex;justify-content:space-between;gap:8px;margin-top:18px">' +
        (i > 0 ? '<button class="btn" data-mod="' + MODS[i - 1].id + '">← ' + esc(MODS[i - 1].title) + '</button>' : "<span></span>") +
        (i < MODS.length - 1 ? '<button class="btn primary" data-mod="' + MODS[i + 1].id + '">Next: ' + esc(MODS[i + 1].title) + ' →</button>' : "") + '</div>';
    }
    document.getElementById("view-study").innerHTML = '<div class="study">' + rail + '<div style="min-width:0">' + sel + head + fh + body + nav + '</div></div>';
  }
  function refreshTopic(id) {
    var el = document.getElementById("t-" + id);
    if (!el) return;
    var showMod = !!document.getElementById("q").value.trim();
    var tmp = document.createElement("div"); tmp.innerHTML = topicHtml(TOPIC[id], showMod);
    el.replaceWith(tmp.firstChild);
  }
  function refreshStudyChrome() {
    // update counts in rail + header without touching open topics
    MODS.forEach(function (m) {
      var st = modStats(m), b = document.querySelector('.rail button[data-mod="' + m.id + '"] .pc');
      if (b) { b.textContent = st.done + "/" + st.total; b.classList.toggle("full", st.done === st.total); }
    });
    var m = BY_ID[UI.mod], st = modStats(m), hd = document.querySelector(".modhead .eyebrow"), bar = document.querySelector(".modhead .bar i");
    if (hd && !document.getElementById("q").value.trim()) hd.textContent = "Module " + m.num + " of " + MODS.length + " · " + st.done + "/" + st.total + " done · " + st.mustD + "/" + st.must + " must-know";
    if (bar) bar.style.width = st.pct + "%";
  }

  /* ---------- revise ---------- */
  var card = null, revealed = false, seen = {};
  function poolList() {
    var base = UI.poolMod ? BY_ID[UI.poolMod].topics : ALL;
    return base.filter(function (t) {
      if (UI.pool === "flagged") return S.rev[t.id] || S.conf[t.id] === 1;
      if (UI.pool === "must") return t.tag === "must" && S.conf[t.id] !== 3;
      if (UI.pool === "done") return S.done[t.id];
      return true;
    });
  }
  function nextCard() {
    var p = poolList();
    if (!p.length) { card = null; return; }
    var fresh = p.filter(function (t) { return !seen[t.id] && (!card || t.id !== card.id); });
    if (!fresh.length) { seen = {}; fresh = p.filter(function (t) { return !card || t.id !== card.id; }); if (!fresh.length) fresh = p; }
    card = fresh[Math.floor(Math.random() * fresh.length)];
    seen[card.id] = 1; revealed = false;
  }
  function renderRevise() {
    var p = poolList();
    if (card && p.indexOf(card) === -1 && !revealed) card = null;
    if (!card) nextCard();
    var pools = [["flagged", "Flagged + Shaky"], ["must", "Must-know not yet Confident"], ["done", "Everything I've done"], ["all", "All topics"]];
    var h = '<div class="modhead"><div class="eyebrow">Flashcard revision</div><h1>Say it aloud, then check</h1><p>Read the question, answer out loud in 15–30 seconds, then reveal and rate yourself. Shaky cards get flagged and come back.</p></div>';
    h += '<div class="filters">' + pools.map(function (x) { return '<button class="chip" data-pool="' + x[0] + '" aria-pressed="' + (UI.pool === x[0]) + '">' + x[1] + '</button>'; }).join("") +
      '<select id="poolmod" class="chip" aria-label="Module filter"><option value="">All modules</option>' + MODS.map(function (m) { return '<option value="' + m.id + '"' + (UI.poolMod === m.id ? " selected" : "") + '>' + m.num + '. ' + esc(m.title) + '</option>'; }).join("") + '</select></div>';
    h += '<div class="rev-grid"><div class="card">';
    if (!card) {
      h += '<div class="empty">' + (UI.pool === "flagged" ? "No flagged or Shaky topics yet. Flag topics while studying, or switch to Must-know." : "No topics in this pool yet. Pick another pool above.") + '</div>';
    } else {
      var m = TOPIC_MOD[card.id];
      h += '<div class="eyebrow">' + esc(m.title) + ' · ' + (TYPE_LABEL[card.type] || card.type) + (card.tag === "must" ? " · must-know" : "") + ' · ' + p.length + ' in pool</div>' +
        '<div class="q">' + esc(card.title) + '</div>';
      if (!revealed) h += '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-rv="show">Show answer</button><button class="btn" data-rv="skip">Skip</button></div>';
      else {
        h += bodyHtml(card, false) +
          '<div class="actions"><span class="muted" style="font-size:13px">How did you do?</span>' +
          '<button class="btn" data-rv="1" style="color:var(--shaky)">Shaky</button><button class="btn" data-rv="2">OK</button><button class="btn" data-rv="3" style="color:var(--done)">Confident</button>' +
          '<button class="btn" data-rv="skip">Next →</button></div>';
      }
    }
    h += '</div><div class="panel"><h3>Flagged for revision</h3>';
    var flagged = ALL.filter(function (t) { return S.rev[t.id]; });
    h += flagged.length ? '<div class="revlist">' + flagged.map(function (t) { return '<button data-jump="' + t.id + '"><span>' + esc(t.title) + '</span><span class="muted" style="font-size:12px;white-space:nowrap">' + esc(TOPIC_MOD[t.id].title.split(" ")[0]) + '</span></button>'; }).join("") + '</div>'
      : '<p class="muted" style="font-size:14px">Nothing flagged yet. Use “Flag for revision” on any topic, or rate a card Shaky.</p>';
    h += '</div></div>';
    document.getElementById("view-revise").innerHTML = h;
  }

  /* ---------- view switching ---------- */
  function show(view) {
    UI.view = view; saveUi();
    ["plan", "study", "revise"].forEach(function (v) {
      document.getElementById("view-" + v).hidden = v !== view;
      document.getElementById("tab-" + v).setAttribute("aria-selected", v === view);
    });
    if (view === "plan") renderPlan(); else if (view === "study") renderStudy(); else renderRevise();
  }
  function renderAll() { renderOverall(); show(UI.view); }
  function openModule(id, topicId) {
    document.getElementById("q").value = "";
    UI.mod = id; saveUi();
    if (topicId) openSet[topicId] = true;
    show("study");
    var target = topicId ? document.getElementById("t-" + topicId) : null;
    window.scrollTo({ top: 0 });
    if (target) target.scrollIntoView({ block: "start" });
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("button,[data-open]"); if (!el) return;
    var d = el.dataset;
    if (d.view) return show(d.view);
    if (d.open) return openModule(d.open);
    if (d.mod) return openModule(d.mod);
    if (d.filter) { UI.filter = d.filter; saveUi(); return renderStudy(); }
    if (d.toggle) { openSet[d.toggle] = !openSet[d.toggle]; return refreshTopic(d.toggle); }
    if (d.copy) {
      var code = TOPIC[d.copy].code, b = el;
      var done = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 1400); };
      try { navigator.clipboard.writeText(code).then(done, function () { selectCode(b); }); } catch (x) { selectCode(b); }
      return;
    }
    if (d.act) {
      var id = d.id;
      if (d.act === "done") { if (S.done[id]) delete S.done[id]; else S.done[id] = 1; }
      if (d.act === "rev") { if (S.rev[id]) delete S.rev[id]; else S.rev[id] = 1; }
      if (d.act === "conf") { var c = +d.c; if (S.conf[id] === c) delete S.conf[id]; else { S.conf[id] = c; if (c === 1) S.rev[id] = 1; } }
      persist(); renderOverall(); refreshTopic(id); refreshStudyChrome(); return;
    }
    if (d.pool) { UI.pool = d.pool; saveUi(); card = null; seen = {}; return renderRevise(); }
    if (d.rv) {
      if (d.rv === "show") { revealed = true; return renderRevise(); }
      if (d.rv === "skip") { nextCard(); return renderRevise(); }
      var cv = +d.rv; S.conf[card.id] = cv;
      if (cv === 1) S.rev[card.id] = 1; else if (cv === 3) delete S.rev[card.id];
      persist(); renderOverall(); nextCard(); return renderRevise();
    }
    if (d.jump) return openModule(TOPIC_MOD[d.jump].id, d.jump);
  });
  function selectCode(btn) {
    var pre = btn.parentNode.querySelector("pre"); var r = document.createRange(); r.selectNodeContents(pre);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Press Ctrl+C";
  }
  var noteTimer = null;
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.note) {
      var v = t.value; if (v) S.notes[t.dataset.note] = v; else delete S.notes[t.dataset.note];
      clearTimeout(noteTimer); noteTimer = setTimeout(persist, 600);
    }
    if (t.id === "q") { if (UI.view !== "study") show("study"); else renderStudy(); }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "start") { S.start = t.value || null; persist(); renderPlan(); }
    if (t.id === "railsel") openModule(t.value);
    if (t.id === "poolmod") { UI.poolMod = t.value; saveUi(); card = null; seen = {}; renderRevise(); }
  });

  renderAll();
})();

</script>

</body></html>
